          cat > app/src/main/java/com/floatplayer/MainActivity.kt <<'EOF'
          package com.floatplayer
          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.DocumentsContract
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          class MainActivity : Activity() {
              private lateinit var web: WebView
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val skipAuto = intent?.getBooleanExtra("pickForQueue", false) == true ||
                      intent?.getBooleanExtra("showLists", false) == true ||
            intent?.getBooleanExtra("pickFolderForQueue", false) == true
                  if (!skipAuto && hasSavedPlayer() && Settings.canDrawOverlays(this)) {
                      try {
                          val s = Intent(this, PlayerService::class.java)
                          s.putExtra("restore", true)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(s) else startService(s)
                          finish()
                          return
                      } catch (_: Exception) {}
                  }
                  window.statusBarColor = Color.rgb(15, 24, 53)
                  window.navigationBarColor = Color.rgb(15, 24, 53)
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.webChromeClient = WebChromeClient()
                  web.setBackgroundColor(Color.rgb(15, 24, 53))
                  web.addJavascriptInterface(Bridge(), "Android")
                  setContentView(web)
                  web.loadUrl("file:///android_asset/index.html")
                  if (intent?.getBooleanExtra("pickForQueue", false) == true) {
                      intent.removeExtra("pickForQueue")
                      web.post { openPicker(8) }
                  }
                  if (intent?.getBooleanExtra("pickFolderForQueue", false) == true) {
                      intent.removeExtra("pickFolderForQueue")
                      web.post { openFolderPicker(10) }
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  }
              }
              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  if (intent?.getBooleanExtra("pickForQueue", false) == true) {
                      intent.removeExtra("pickForQueue")
                      web.post { openPicker(8) }
                  }
                  if (intent?.getBooleanExtra("pickFolderForQueue", false) == true) {
                      intent.removeExtra("pickFolderForQueue")
                      web.post { openFolderPicker(10) }
                  }
              }
              private fun openFolderPicker(requestCode: Int) {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT_TREE)
                  i.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION or
                      Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                  )
                  startActivityForResult(i, requestCode)
              }
              private fun isAudioName(n: String): Boolean {
                  val e = n.substringAfterLast('.', "").lowercase()
                  return e in setOf("mp3", "m4a", "aac", "wav", "ogg", "opus", "flac", "wma", "amr", "mka")
              }
              private fun isVideoName(n: String): Boolean {
                  val e = n.substringAfterLast('.', "").lowercase()
                  return e in setOf("mp4", "mkv", "webm", "3gp", "avi", "mov", "m4v", "ts", "mpeg", "mpg", "ogv")
              }
              private fun naturalCompare(a: String, b: String): Int {
                  var i = 0
                  var j = 0
                  while (i < a.length && j < b.length) {
                      if (a[i].isDigit() && b[j].isDigit()) {
                          var si = i
                          while (si < a.length && a[si].isDigit()) si++
                          var sj = j
                          while (sj < b.length && b[sj].isDigit()) sj++
                          val na = a.substring(i, si).trimStart('0')
                          val nb = b.substring(j, sj).trimStart('0')
                          if (na.length != nb.length) return na.length - nb.length
                          val c = na.compareTo(nb)
                          if (c != 0) return c
                          i = si
                          j = sj
                      } else {
                          val c = a[i].lowercaseChar().compareTo(b[j].lowercaseChar())
                          if (c != 0) return c
                          i++
                          j++
                      }
                  }
                  return (a.length - i) - (b.length - j)
              }
              private fun scanFolder(tree: Uri, docId: String, out: ArrayList<Pair<String, String>>, depth: Int) {
                  val kids = ArrayList<Triple<String, String, String>>()
                  val children = DocumentsContract.buildChildDocumentsUriUsingTree(tree, docId)
                  contentResolver.query(
                      children,
                      arrayOf(
                          DocumentsContract.Document.COLUMN_DOCUMENT_ID,
                          DocumentsContract.Document.COLUMN_DISPLAY_NAME,
                          DocumentsContract.Document.COLUMN_MIME_TYPE
                      ),
                      null, null, null
                  )?.use { c ->
                      while (c.moveToNext()) {
                          kids.add(Triple(c.getString(0) ?: "", c.getString(1) ?: "", c.getString(2) ?: ""))
                      }
                  }
                  kids.sortWith(Comparator { a, b -> naturalCompare(a.second, b.second) })
                  for ((id, name, mime) in kids) {
                      if (mime == DocumentsContract.Document.MIME_TYPE_DIR) {
                          if (depth < 6) scanFolder(tree, id, out, depth + 1)
                      } else if (mime.startsWith("audio/") || mime.startsWith("video/") || isAudioName(name) || isVideoName(name)) {
                          out.add(DocumentsContract.buildDocumentUriUsingTree(tree, id).toString() to name)
                      }
                  }
              }
              private fun handleFolder(rc: Int, tree: Uri) {
                  try {
                      contentResolver.takePersistableUriPermission(tree, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  } catch (_: Exception) {}
                  Toast.makeText(this, "جارٍ فحص المجلد...", Toast.LENGTH_SHORT).show()
                  Thread {
                      val found = ArrayList<Pair<String, String>>()
                      var folder = ""
                      try {
                          val rootId = DocumentsContract.getTreeDocumentId(tree)
                          folder = rootId.substringAfterLast('/').substringAfterLast(':')
                          scanFolder(tree, rootId, found, 0)
                      } catch (_: Exception) {}
                      val arr = JSONArray()
                      for (f in found) {
                          arr.put(JSONObject().put("uri", f.first).put("name", f.second.substringBeforeLast('.')))
                      }
                      runOnUiThread {
                          if (arr.length() == 0) {
                              Toast.makeText(this, "لا توجد ملفات صوت أو فيديو مدعومة في هذا المجلد", Toast.LENGTH_LONG).show()
                          } else if (rc == 10) {
                              PlayerService.inst?.appendTracks(arr)
                          } else {
                              val r = JSONObject()
                                  .put("folder", if (folder.isEmpty()) "مجلد" else folder)
                                  .put("tracks", arr)
                              web.evaluateJavascript("onFolderPicked(" + r.toString() + ")", null)
                          }
                      }
                  }.start()
              }
              private fun hasSavedPlayer(): Boolean = try {
                  JSONArray(getSharedPreferences("fp", MODE_PRIVATE).getString("q", "[]") ?: "[]").length() > 0
              } catch (_: Exception) { false }
              private fun openPicker(requestCode: Int) {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  i.putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("audio/*", "video/*"))
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  i.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION or
                      Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                  )
                  startActivityForResult(i, requestCode)
              }
              override fun onBackPressed() {
                  web.evaluateJavascript("goBack()") {
                      if (it == "true") finish()
                  }
              }
              private fun nameOf(u: Uri): String {
                  var n = "صوتية"
                  try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          if (c.moveToFirst()) {
                              val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (i >= 0) n = c.getString(i)
                          }
                      }
                  } catch (_: Exception) {}
                  return n.substringBeforeLast('.')
              }
              @Deprecated("Deprecated in Android")
              override fun onActivityResult(rc: Int, res: Int, d: Intent?) {
                  super.onActivityResult(rc, res, d)
                  if (rc == 9 || rc == 10) {
                      val tree = d?.data
                      if (res == RESULT_OK && tree != null) handleFolder(rc, tree)
                      return
                  }
                  if ((rc == 7 || rc == 8) && res == RESULT_OK && d != null) {
                      val uris = ArrayList<Uri>()
                      val cd = d.clipData
                      if (cd != null) {
                          for (i in 0 until cd.itemCount) uris.add(cd.getItemAt(i).uri)
                      } else if (d.data != null) uris.add(d.data!!)
                      val arr = JSONArray()
                      for (u in uris) {
                          try {
                              contentResolver.takePersistableUriPermission(
                                  u, Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {}
                          arr.put(JSONObject().put("uri", u.toString()).put("name", nameOf(u)))
                      }
                      if (rc == 8) {
                          PlayerService.inst?.appendTracks(arr)
                      } else {
                          web.evaluateJavascript("onPicked(" + arr.toString() + ")", null)
                      }
                  }
              }
              inner class Bridge {
                  @JavascriptInterface
                  fun pick() {
                      runOnUiThread { openPicker(7) }
                  }
                  @JavascriptInterface
                  fun pickFolder() {
                      runOnUiThread { openFolderPicker(9) }
                  }
                  @JavascriptInterface
                  fun play(q: String, i: Int, p: Int) {
                      runOnUiThread {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "فعّل العرض فوق التطبيقات الأخرى ثم اضغط تشغيل مجددًا",
                                  Toast.LENGTH_LONG
                              ).show()
                              startActivity(
                                  Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:" + packageName)
                                  )
                              )
                          } else {
                              val s = Intent(this@MainActivity, PlayerService::class.java)
                              s.putExtra("queue", q)
                              s.putExtra("idx", i)
                              s.putExtra("pos", p)
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(s)
                              } else {
                                  startService(s)
                              }
                          }
                      }
                  }
                  @JavascriptInterface
                  fun saveState(s: String) {
                      getSharedPreferences("fp", MODE_PRIVATE).edit().putString("web", s).apply()
                  }
                  @JavascriptInterface
                  fun loadState(): String =
                      getSharedPreferences("fp", MODE_PRIVATE).getString("web", "") ?: ""
                  @JavascriptInterface
                  fun state(): String = PlayerService.inst?.stateJson() ?: "{}"
              }
          }
          EOF
          cat > app/src/main/java/com/floatplayer/PlayerAccessibilityService.kt <<'EOF'
          package com.floatplayer
          import android.accessibilityservice.AccessibilityButtonController
          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Build
          import android.provider.Settings
          import android.view.accessibility.AccessibilityEvent
          class PlayerAccessibilityService : AccessibilityService() {
              private var callback: AccessibilityButtonController.AccessibilityButtonCallback? = null
              override fun onServiceConnected() {
                  super.onServiceConnected()
                  val cb = object : AccessibilityButtonController.AccessibilityButtonCallback() {
