          package com.floatplayer

          import android.accessibilityservice.AccessibilityButtonController
          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Build
          import android.provider.Settings
          import android.view.accessibility.AccessibilityEvent

          class PlayerAccessibilityService : AccessibilityService() {
              private var callback: AccessibilityButtonController.AccessibilityButtonCallback? = null

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  val cb = object : AccessibilityButtonController.AccessibilityButtonCallback() {
                      override fun onClicked(controller: AccessibilityButtonController) {
                          onButton()
                      }
                  }
                  callback = cb
                  try { accessibilityButtonController.registerAccessibilityButtonCallback(cb) } catch (_: Exception) {}
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onDestroy() {
                  callback?.let {
                      try { accessibilityButtonController.unregisterAccessibilityButtonCallback(it) } catch (_: Exception) {}
                  }
                  callback = null
                  super.onDestroy()
              }

              private fun openApp() {
                  try {
                      val i = Intent(this, MainActivity::class.java)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(i)
                  } catch (_: Exception) {}
              }

              private fun onButton() {
                  val svc = PlayerService.inst
                  if (svc != null) {
                      svc.toggleVisibility()
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      openApp()
                      return
                  }
                  try {
                      val s = Intent(this, PlayerService::class.java)
                      s.putExtra("restore", true)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(s) else startService(s)
                  } catch (_: Exception) {
                      openApp()
                  }
              }
          }
