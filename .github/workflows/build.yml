name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Android project files
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "PdfFloatingReader"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.pdffloat"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.pdffloat"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingReaderService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="floating_pdf_reader" />
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">قارئ PDF العائم</string>
              <string name="intro">اختر كتاب PDF من ذاكرة الهاتف، وسيظهر في نافذة عائمة فوق التطبيقات الأخرى.</string>
              <string name="pick_button">اختيار كتاب PDF</string>
              <string name="preparing">جارٍ تحضير الكتاب…</string>
              <string name="running">القارئ يعمل الآن. يمكنك فتح أي تطبيق آخر.</string>
              <string name="permission_needed">يلزم السماح بالعرض فوق التطبيقات الأخرى</string>
              <string name="overlay_denied">لم يتم منح إذن النافذة العائمة</string>
              <string name="copy_error">تعذّر قراءة الملف المحدد</string>
              <string name="open_error">تعذّر فتح الملف (قد يكون تالفاً أو محمياً بكلمة مرور)</string>
              <string name="channel_name">خدمة القراءة</string>
              <string name="notif_title">القارئ العائم يعمل</string>
              <string name="notif_text">اضغط لإظهار النافذة</string>
              <string name="notif_close">إغلاق</string>
          </resources>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="96dp"
              android:height="96dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#1565C0"
                  android:pathData="M0,0h96v96h-96z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M20,28h24c2.2,0 4,1.8 4,4v36c0,-1.7 -1.3,-3 -3,-3H20z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M76,28H52c-2.2,0 -4,1.8 -4,4v36c0,-1.7 1.3,-3 3,-3h25z" />
          </vector>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_notification.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="96"
              android:viewportHeight="96">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M20,28h24c2.2,0 4,1.8 4,4v36c0,-1.7 -1.3,-3 -3,-3H20z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M76,28H52c-2.2,0 -4,1.8 -4,4v36c0,-1.7 1.3,-3 3,-3h25z" />
          </vector>
          EOF
          mkdir -p app/src/main/java/com/example/pdffloat
          cat > app/src/main/java/com/example/pdffloat/MainActivity.kt <<'EOF'
          package com.example.pdffloat

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File

          class MainActivity : Activity() {

              companion object {
                  private const val REQ_PICK = 1
                  private const val REQ_OVERLAY = 2
                  private const val REQ_NOTIF = 3
              }

              private lateinit var status: TextView
              private var pendingPath: String? = null
              private var pendingName: String = "book"

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val pad = dp(24)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(pad, pad, pad, pad)
                      setBackgroundColor(Color.WHITE)
                  }

                  val title = TextView(this).apply {
                      setText(R.string.app_name)
                      textSize = 26f
                      setTypeface(typeface, Typeface.BOLD)
                      setTextColor(Color.parseColor("#1565C0"))
                      gravity = Gravity.CENTER
                  }

                  status = TextView(this).apply {
                      setText(R.string.intro)
                      textSize = 16f
                      setTextColor(Color.DKGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, dp(16), 0, dp(24))
                  }

                  val pick = Button(this).apply {
                      setText(R.string.pick_button)
                      textSize = 18f
                      setOnClickListener { pickPdf() }
                  }

                  root.addView(title)
                  root.addView(status)
                  root.addView(pick)
                  setContentView(root)

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), REQ_NOTIF)
                  }
              }

              private fun pickPdf() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "application/pdf"
                  }
                  @Suppress("DEPRECATION")
                  startActivityForResult(intent, REQ_PICK)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  when (requestCode) {
                      REQ_PICK -> {
                          val uri = data?.data
                          if (resultCode == RESULT_OK && uri != null) prepare(uri)
                      }
                      REQ_OVERLAY -> {
                          if (Settings.canDrawOverlays(this)) {
                              launchReader()
                          } else {
                              Toast.makeText(this, R.string.overlay_denied, Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              private fun queryName(uri: Uri): String {
                  try {
                      contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)
                          ?.use { c ->
                              if (c.moveToFirst()) {
                                  val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                                  if (idx >= 0) return c.getString(idx) ?: "book"
                              }
                          }
                  } catch (_: Exception) {
                  }
                  return "book"
              }

              private fun prepare(uri: Uri) {
                  status.setText(R.string.preparing)
                  pendingName = queryName(uri)
                  Thread {
                      try {
                          // احذف النسخ القديمة ثم انسخ الكتاب الجديد باسم فريد
                          filesDir.listFiles()?.forEach {
                              if (it.name.startsWith("book_") && it.name.endsWith(".pdf")) it.delete()
                          }
                          val out = File(filesDir, "book_${System.currentTimeMillis()}.pdf")
                          val input = contentResolver.openInputStream(uri)
                              ?: throw IllegalStateException("no stream")
                          input.use { src -> out.outputStream().use { dst -> src.copyTo(dst) } }
                          runOnUiThread {
                              pendingPath = out.absolutePath
                              launchReader()
                          }
                      } catch (e: Exception) {
                          runOnUiThread { status.setText(R.string.copy_error) }
                      }
                  }.start()
              }

              private fun launchReader() {
                  val path = pendingPath ?: return

                  if (!Settings.canDrawOverlays(this)) {
                      Toast.makeText(this, R.string.permission_needed, Toast.LENGTH_LONG).show()
                      @Suppress("DEPRECATION")
                      startActivityForResult(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")),
                          REQ_OVERLAY
                      )
                      return
                  }

                  val intent = Intent(this, FloatingReaderService::class.java)
                      .putExtra(FloatingReaderService.EXTRA_PATH, path)
                      .putExtra(FloatingReaderService.EXTRA_NAME, pendingName)
                  startForegroundService(intent)
                  status.setText(R.string.running)
                  moveTaskToBack(true)
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/pdffloat
          cat > app/src/main/java/com/example/pdffloat/FloatingReaderService.kt <<'EOF'
          package com.example.pdffloat

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.graphics.pdf.PdfRenderer
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.ParcelFileDescriptor
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewConfiguration
          import android.view.WindowManager
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat
          import java.io.File
          import java.util.concurrent.Executors
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          class FloatingReaderService : Service() {

              companion object {
                  const val EXTRA_PATH = "path"
                  const val EXTRA_NAME = "name"
                  const val ACTION_STOP = "com.example.pdffloat.STOP"
                  const val ACTION_SHOW = "com.example.pdffloat.SHOW"
                  private const val CHANNEL_ID = "reader"
                  private const val NOTIF_ID = 1

                  // اجعلها true للكتب العربية: النقر على اليمين = الصفحة السابقة، واليسار = التالية
                  private const val RTL_BOOK = false
              }

              private lateinit var wm: WindowManager
              private lateinit var prefs: SharedPreferences
              private val ui = Handler(Looper.getMainLooper())
              private val io = Executors.newSingleThreadExecutor()

              // الكتاب
              private var pfd: ParcelFileDescriptor? = null
              private var renderer: PdfRenderer? = null
              private var pageCount = 0
              private var current = 0
              private var bookKey = ""
              private var renderToken = 0

              // النافذة العائمة
              private lateinit var windowView: LinearLayout
              private lateinit var windowParams: WindowManager.LayoutParams
              private lateinit var pageContainer: FrameLayout
              private lateinit var pageImage: ImageView
              private lateinit var pageLabel: TextView
              private lateinit var seekBar: SeekBar
              private var windowAdded = false

              // الأيقونة العائمة
              private lateinit var bubbleView: TextView
              private lateinit var bubbleParams: WindowManager.LayoutParams
              private var bubbleAdded = false

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  prefs = getSharedPreferences("reader", MODE_PRIVATE)
                  startAsForeground()
                  buildWindow()
                  buildBubble()
                  addWindow()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_STOP -> {
                          stopSelf()
                          return START_NOT_STICKY
                      }
                      ACTION_SHOW -> {
                          restore()
                          return START_NOT_STICKY
                      }
                  }
                  val path = intent?.getStringExtra(EXTRA_PATH)
                  if (path == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  openBook(path, intent?.getStringExtra(EXTRA_NAME) ?: "book")
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  removeWindow()
                  removeBubble()
                  closeBook()
                  io.shutdown()
                  super.onDestroy()
              }

              // ---------------------------------------------------------------- إشعار الخدمة

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(CHANNEL_ID, getString(R.string.channel_name), NotificationManager.IMPORTANCE_LOW)
                  )
                  val flags = PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  val stopPi = PendingIntent.getService(
                      this, 1,
                      Intent(this, FloatingReaderService::class.java).apply { action = ACTION_STOP },
                      flags
                  )
                  val showPi = PendingIntent.getService(
                      this, 2,
                      Intent(this, FloatingReaderService::class.java).apply { action = ACTION_SHOW },
                      flags
                  )
                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.drawable.ic_notification)
                      .setContentTitle(getString(R.string.notif_title))
                      .setContentText(getString(R.string.notif_text))
                      .setContentIntent(showPi)
                      .addAction(0, getString(R.string.notif_close), stopPi)
                      .setOngoing(true)
                      .build()
                  ServiceCompat.startForeground(
                      this, NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                  )
              }

              // ---------------------------------------------------------------- الكتاب

              private fun openBook(path: String, name: String) {
                  try {
                      closeBook()
                      val d = ParcelFileDescriptor.open(File(path), ParcelFileDescriptor.MODE_READ_ONLY)
                      pfd = d
                      val r = PdfRenderer(d)
                      renderer = r
                      pageCount = r.pageCount
                      if (pageCount == 0) throw IllegalStateException("empty pdf")
                      bookKey = "last_${name}_$pageCount"
                      current = prefs.getInt(bookKey, 0).coerceIn(0, pageCount - 1)
                      seekBar.max = max(pageCount - 1, 0)
                      seekBar.progress = current
                      restore()
                      showPage(current)
                  } catch (e: Exception) {
                      Toast.makeText(this, R.string.open_error, Toast.LENGTH_LONG).show()
                      stopSelf()
                  }
              }

              private fun closeBook() {
                  val r = renderer
                  val d = pfd
                  renderer = null
                  pfd = null
                  pageCount = 0
                  // الإغلاق على نفس الخيط الذي يرسم الصفحات حتى لا يحدث تعارض
                  if (r != null || d != null) {
                      io.execute {
                          try { r?.close() } catch (_: Exception) {}
                          try { d?.close() } catch (_: Exception) {}
                      }
                  }
              }

              private fun updateLabel() {
                  pageLabel.text = "${current + 1} / $pageCount"
              }

              private fun go(delta: Int) {
                  val n = current + delta
                  if (n in 0 until pageCount) {
                      seekBar.progress = n
                      showPage(n)
                  }
              }

              private fun showPage(index: Int) {
                  val r = renderer ?: return
                  if (index !in 0 until pageCount) return
                  current = index
                  updateLabel()
                  prefs.edit().putInt(bookKey, index).apply()

                  val aw = pageContainer.width
                  val ah = pageContainer.height
                  if (aw <= 0 || ah <= 0) {
                      // النافذة لم تأخذ مقاسها بعد
                      pageContainer.postDelayed({ if (renderer === r) showPage(index) }, 60)
                      return
                  }

                  val token = ++renderToken
                  io.execute {
                      var result: Bitmap? = null
                      try {
                          val page = r.openPage(index)
                          try {
                              val scale = min(aw.toFloat() / page.width, ah.toFloat() / page.height) * 1.5f
                              var w = max((page.width * scale).toInt(), 1)
                              var h = max((page.height * scale).toInt(), 1)
                              val maxDim = 3000
                              if (max(w, h) > maxDim) {
                                  val k = maxDim.toFloat() / max(w, h)
                                  w = max((w * k).toInt(), 1)
                                  h = max((h * k).toInt(), 1)
                              }
                              val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                              bmp.eraseColor(Color.WHITE)
                              page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                              result = bmp
                          } finally {
                              page.close()
                          }
                      } catch (_: Exception) {
                          result = null
                      }
                      val finalBitmap = result
                      ui.post {
                          if (token == renderToken && finalBitmap != null) {
                              pageImage.setImageBitmap(finalBitmap)
                          }
                      }
                  }
              }

              // ---------------------------------------------------------------- بناء النافذة

              private fun textButton(label: String, onClick: () -> Unit): TextView =
                  TextView(this).apply {
                      text = label
                      textSize = 20f
                      setTextColor(Color.parseColor("#222222"))
                      gravity = Gravity.CENTER
                      layoutParams = LinearLayout.LayoutParams(dp(40), dp(40))
                      setOnClickListener { onClick() }
                  }

              private fun buildWindow() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutDirection = View.LAYOUT_DIRECTION_LTR
                      background = GradientDrawable().apply {
                          setColor(Color.WHITE)
                          cornerRadius = dp(12).toFloat()
                          setStroke(dp(1), Color.parseColor("#BBBBBB"))
                      }
                  }

                  // الشريط العلوي: سحب + تصغير/تكبير + إخفاء + إغلاق
                  val bar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#F2F2F2"))
                      setPadding(dp(12), 0, dp(4), 0)
                  }
                  val handle = TextView(this).apply {
                      text = "⋮⋮  PDF"
                      textSize = 14f
                      setTextColor(Color.parseColor("#555555"))
                      layoutParams = LinearLayout.LayoutParams(0, dp(40), 1f)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  bar.addView(handle)
                  bar.addView(textButton("−") { zoom(1f / 1.2f) })
                  bar.addView(textButton("+") { zoom(1.2f) })
                  bar.addView(textButton("▁") { minimize() })
                  bar.addView(textButton("✕") { stopSelf() })

                  // منطقة الصفحة
                  pageContainer = FrameLayout(this).apply {
                      setBackgroundColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f
                      )
                  }
                  pageImage = ImageView(this).apply {
                      scaleType = ImageView.ScaleType.FIT_CENTER
                      isClickable = true
                  }
                  pageContainer.addView(
                      pageImage,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )
                  var lastX = 0f
                  pageImage.setOnTouchListener { _, e ->
                      if (e.actionMasked == MotionEvent.ACTION_DOWN) lastX = e.x
                      false
                  }
                  pageImage.setOnClickListener {
                      val leftSide = lastX < pageImage.width / 2f
                      val goBack = if (RTL_BOOK) !leftSide else leftSide
                      go(if (goBack) -1 else 1)
                  }

                  // الشريط السفلي: رقم الصفحة + شريط التمرير
                  val bottom = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#F2F2F2"))
                      setPadding(dp(12), 0, dp(8), 0)
                  }
                  pageLabel = TextView(this).apply {
                      text = "0 / 0"
                      textSize = 13f
                      setTextColor(Color.parseColor("#222222"))
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT, dp(40)
                      )
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  seekBar = SeekBar(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, dp(40), 1f)
                  }
                  seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                          if (fromUser) pageLabel.text = "${progress + 1} / $pageCount"
                      }

                      override fun onStartTrackingTouch(sb: SeekBar?) {}

                      override fun onStopTrackingTouch(sb: SeekBar?) {
                          showPage(seekBar.progress)
                      }
                  })
                  bottom.addView(pageLabel)
                  bottom.addView(seekBar)

                  root.addView(bar, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp(40)
                  ))
                  root.addView(pageContainer)
                  root.addView(bottom, LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT, dp(40)
                  ))
                  windowView = root

                  val dm = resources.displayMetrics
                  windowParams = WindowManager.LayoutParams(
                      (dm.widthPixels * 0.82f).toInt(),
                      (dm.heightPixels * 0.65f).toInt(),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = (dm.widthPixels * 0.09f).toInt()
                      y = dp(60)
                  }

                  makeDraggable(bar, windowView, windowParams, null)
              }

              private fun buildBubble() {
                  val size = dp(56)
                  bubbleView = TextView(this).apply {
                      text = "📖"
                      textSize = 26f
                      gravity = Gravity.CENTER
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#1565C0"))
                      }
                  }
                  val dm = resources.displayMetrics
                  bubbleParams = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dm.widthPixels - size - dp(8)
                      y = dm.heightPixels / 3
                  }
                  makeDraggable(bubbleView, bubbleView, bubbleParams) { restore() }
              }

              /** يجعل [handle] مقبضاً لسحب النافذة [root]؛ والنقرة القصيرة تستدعي [onTap]. */
              private fun makeDraggable(
                  handle: View,
                  root: View,
                  params: WindowManager.LayoutParams,
                  onTap: (() -> Unit)?
              ) {
                  val slop = ViewConfiguration.get(this).scaledTouchSlop
                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var moved = false
                  handle.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = e.rawX
                              downY = e.rawY
                              startX = params.x
                              startY = params.y
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX
                              val dy = e.rawY - downY
                              if (!moved && (abs(dx) > slop || abs(dy) > slop)) moved = true
                              if (moved) {
                                  params.x = startX + dx.toInt()
                                  params.y = startY + dy.toInt()
                                  try {
                                      wm.updateViewLayout(root, params)
                                  } catch (_: Exception) {
                                  }
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) onTap?.invoke()
                          }
                      }
                      true
                  }
              }

              // ---------------------------------------------------------------- تكبير / تصغير / إخفاء

              private fun zoom(factor: Float) {
                  val dm = resources.displayMetrics
                  val minW = min(dp(200), dm.widthPixels)
                  val minH = min(dp(280), dm.heightPixels)
                  val newW = (windowParams.width * factor).toInt().coerceIn(minW, dm.widthPixels)
                  val newH = (windowParams.height * factor).toInt().coerceIn(minH, dm.heightPixels)
                  windowParams.width = newW
                  windowParams.height = newH
                  windowParams.x = windowParams.x.coerceIn(0, max(0, dm.widthPixels - newW))
                  windowParams.y = windowParams.y.coerceIn(0, max(0, dm.heightPixels - newH))
                  if (windowAdded) {
                      try {
                          wm.updateViewLayout(windowView, windowParams)
                      } catch (_: Exception) {
                      }
                  }
                  // أعد رسم الصفحة بالمقاس الجديد بعد أن تأخذ النافذة قياسها
                  pageContainer.postDelayed({ showPage(current) }, 150)
              }

              private fun minimize() {
                  removeWindow()
                  addBubble()
              }

              private fun restore() {
                  removeBubble()
                  addWindow()
              }

              private fun addWindow() {
                  if (windowAdded) return
                  try {
                      wm.addView(windowView, windowParams)
                      windowAdded = true
                  } catch (e: Exception) {
                      Toast.makeText(this, R.string.permission_needed, Toast.LENGTH_LONG).show()
                      stopSelf()
                  }
              }

              private fun removeWindow() {
                  if (!windowAdded) return
                  try {
                      wm.removeView(windowView)
                  } catch (_: Exception) {
                  }
                  windowAdded = false
              }

              private fun addBubble() {
                  if (bubbleAdded) return
                  try {
                      wm.addView(bubbleView, bubbleParams)
                      bubbleAdded = true
                  } catch (_: Exception) {
                  }
              }

              private fun removeBubble() {
                  if (!bubbleAdded) return
                  try {
                      wm.removeView(bubbleView)
                  } catch (_: Exception) {
                  }
                  bubbleAdded = false
              }
          }
