name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p proj/app/src/main/java/com/floatplayer
          mkdir -p proj/app/src/main/assets
          mkdir -p proj/app/src/main/res/values
          mkdir -p proj/app/src/main/res/drawable
          cd proj

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'FloatPlayer'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.floatplayer'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.floatplayer'
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="مشغّل الدراسة"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PlayerService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0E2233" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#4CC2E8" android:pathData="M54,17C34.1,17 18,33.1 18,53v17c0,7.2 5.8,13 13,13h4c4.4,0 8,-3.6 8,-8V60c0,-4.4 -3.6,-8 -8,-8h-5v1C30,37.6 40.7,27 54,27s24,10.6 24,26v-1h-5c-4.4,0 -8,3.6 -8,8v15c0,4.4 3.6,8 8,8h4c7.2,0 13,-5.8 13,-13V53C90,33.1 73.9,17 54,17z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,42v27.1c-2.1,-1.6 -4.9,-2.3 -7.8,-1.7 -5,1 -8.1,5.1 -7.1,9.2 1,4.1 5.8,6.5 10.8,5.5 4.2,-0.9 7.1,-3.9 7.3,-7.2V52l19,-4.2v16.3c-2.1,-1.6 -4.9,-2.3 -7.8,-1.7 -5,1 -8.1,5.1 -7.1,9.2 1,4.1 5.8,6.5 10.8,5.5 4.2,-0.9 7.1,-3.9 7.3,-7.2V35z"/>
          </vector>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#4CC2E8</item>
                  <item name="android:statusBarColor">#0E2233</item>
                  <item name="android:navigationBarColor">#0E2233</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/floatplayer/MainActivity.kt <<'EOF'
          package com.floatplayer

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : Activity() {
              private lateinit var web: WebView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = Color.rgb(14, 34, 51)
                  window.navigationBarColor = Color.rgb(14, 34, 51)
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.webChromeClient = WebChromeClient()
                  web.setBackgroundColor(Color.rgb(14, 34, 51))
                  web.addJavascriptInterface(Bridge(), "Android")
                  setContentView(web)
                  web.loadUrl("file:///android_asset/index.html")
                  if (intent?.getBooleanExtra("pickForQueue", false) == true) {
                      intent.removeExtra("pickForQueue")
                      web.post { openPicker(8) }
                  }
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  }
              }

              override fun onNewIntent(intent: Intent?) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  if (intent?.getBooleanExtra("pickForQueue", false) == true) {
                      intent.removeExtra("pickForQueue")
                      web.post { openPicker(8) }
                  }
              }

              private fun openPicker(requestCode: Int) {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "audio/*"
                  i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  i.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION or
                      Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                  )
                  startActivityForResult(i, requestCode)
              }

              override fun onBackPressed() {
                  web.evaluateJavascript("goBack()") {
                      if (it == "true") finish()
                  }
              }

              private fun nameOf(u: Uri): String {
                  var n = "صوتية"
                  try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          if (c.moveToFirst()) {
                              val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (i >= 0) n = c.getString(i)
                          }
                      }
                  } catch (_: Exception) {}
                  return n.substringBeforeLast('.')
              }

              @Deprecated("Deprecated in Android")
              override fun onActivityResult(rc: Int, res: Int, d: Intent?) {
                  super.onActivityResult(rc, res, d)
                  if ((rc == 7 || rc == 8) && res == RESULT_OK && d != null) {
                      val uris = ArrayList<Uri>()
                      val cd = d.clipData
                      if (cd != null) {
                          for (i in 0 until cd.itemCount) uris.add(cd.getItemAt(i).uri)
                      } else if (d.data != null) uris.add(d.data!!)
                      val arr = JSONArray()
                      for (u in uris) {
                          try {
                              contentResolver.takePersistableUriPermission(
                                  u, Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {}
                          arr.put(JSONObject().put("uri", u.toString()).put("name", nameOf(u)))
                      }
                      if (rc == 8) {
                          PlayerService.inst?.appendTracks(arr)
                      } else {
                          web.evaluateJavascript("onPicked(" + arr.toString() + ")", null)
                      }
                  }
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun pick() {
                      runOnUiThread { openPicker(7) }
                  }

                  @JavascriptInterface
                  fun play(q: String, i: Int, p: Int) {
                      runOnUiThread {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "فعّل العرض فوق التطبيقات الأخرى ثم اضغط تشغيل مجددًا",
                                  Toast.LENGTH_LONG
                              ).show()
                              startActivity(
                                  Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:" + packageName)
                                  )
                              )
                          } else {
                              val s = Intent(this@MainActivity, PlayerService::class.java)
                              s.putExtra("queue", q)
                              s.putExtra("idx", i)
                              s.putExtra("pos", p)
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(s)
                              } else {
                                  startService(s)
                              }
                          }
                      }
                  }

                  @JavascriptInterface
                  fun state(): String = PlayerService.inst?.stateJson() ?: "{}"
              }
          }
          EOF

          cat > app/src/main/java/com/floatplayer/PlayerService.kt <<'EOF'
          package com.floatplayer

          import android.app.AlertDialog
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject

          fun fmt(ms: Int): String {
              val s = ms.coerceAtLeast(0) / 1000
              return "%d:%02d".format(s / 60, s % 60)
          }

          class PlayerService : Service() {
              companion object { var inst: PlayerService? = null }

              lateinit var wm: WindowManager
              private var mp: MediaPlayer? = null
              private var ready = false
              var playbackSpeed = 1.0f
              private var queue = JSONArray()
              private var idx = 0
              var curUri = ""
              var curName = ""
              var markA = -1
              var markB = -1
              var loopA = -1
              var loopB = -1
              private var bubble: BubbleView? = null
              private var playlistPanel: View? = null
              private val h = Handler(
