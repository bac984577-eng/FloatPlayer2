              private fun playAt(i: Int, startPos: Int, autoStart: Boolean = true) {
                  if (i < 0 || i >= queue.length()) return
                  val item = queue.getJSONObject(i)
                  idx = i
                  curUri = item.getString("uri")
                  curName = item.getString("name")
                  prefs.edit().putString("q", queue.toString()).putInt("i", i).putInt("p", startPos).apply()
                  cancelAB(false)
                  ready = false
                  try { mp?.release() } catch (_: Exception) {}
                  val player = MediaPlayer()
                  mp = player
                  try {
                      player.setDataSource(this, Uri.parse(curUri))
                      player.setOnPreparedListener {
                          ready = true
                          try { it.playbackParams = it.playbackParams.setSpeed(playbackSpeed) } catch (_: Exception) {}
                          if (startPos > 0) it.seekTo(startPos.coerceAtMost(it.duration))
                          if (autoStart) it.start()
                          bubble?.invalidate()
                      }
                      player.setOnCompletionListener {
                          if (timerEot) {
                              timerEot = false
                              Toast.makeText(this, "انتهت الصوتية، تم إيقاف التشغيل", Toast.LENGTH_LONG).show()
                              bubble?.invalidate()
                          } else if (idx + 1 < queue.length()) {
                              playAt(idx + 1, 0)
                          }
                      }
                      player.setOnErrorListener { _, _, _ ->
                          ready = false
                          true
                      }
                      player.prepareAsync()
                  } catch (_: Exception) {
                      ready = false
                      Toast.makeText(this, "تعذّر تشغيل الملف", Toast.LENGTH_SHORT).show()
