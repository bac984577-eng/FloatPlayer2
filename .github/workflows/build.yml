                  try {
                      val i = Intent(this, MainActivity::class.java)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      i.putExtra("showLists", true)
                      startActivity(i)
                  } catch (_: Exception) {
                      Toast.makeText(this, "افتح التطبيق للوصول إلى القوائم", Toast.LENGTH_SHORT).show()
                  }
              }
              fun trackLabel(i: Int): String {
                  val name = queue.optJSONObject(i)?.optString("name", "صوتية") ?: "صوتية"
                  return (if (i == idx) "▶  " else "") + (i + 1) + ". " + name
              }
              fun tapTrack(i: Int) {
                  val now = SystemClock.uptimeMillis()
                  if (i == trackTapIdx && now - trackTapTime <= 700L) {
                      trackTapCount++
                  } else {
                      trackTapIdx = i
                      trackTapCount = 1
                  }
                  trackTapTime = now
                  h.removeCallbacks(resetMark)
                  if (trackTapCount >= 3) {
                      trackTapIdx = -1
                      trackTapCount = 0
                      playAt(i, 0)
                      return
                  }
                  plLabels[i]?.text = trackLabel(i) + "   " + "●".repeat(trackTapCount) + "○".repeat(3 - trackTapCount)
                  h.postDelayed(resetMark, 700L)
              }
              fun requestAddFolder() {
                  hidePlaylistPanel()
                  try {
                      val i = Intent(this, MainActivity::class.java)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      i.putExtra("pickFolderForQueue", true)
                      startActivity(i)
                  } catch (_: Exception) {
                      Toast.makeText(this, "افتح التطبيق لإضافة مجلد", Toast.LENGTH_SHORT).show()
                  }
              }
              fun sc(v: Float): Int = (v * BS * resources.displayMetrics.density).toInt()
              fun minimize() {
                  val b = bubble ?: return
                  if (mini != null) return
                  val bp = b.lp ?: return
                  hideSpeedPanel()
                  hidePlaylistPanel()
                  val ms = dp(64)
                  val sw = resources.displayMetrics.widthPixels
                  val sh = resources.displayMetrics.heightPixels
                  val p = WindowManager.LayoutParams(
                      ms, ms,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  p.gravity = Gravity.TOP or Gravity.START
                  p.x = (bp.x + sc(90f) - dp(28)).coerceIn(0, (sw - ms).coerceAtLeast(0))
                  p.y = (bp.y + sc(90f) - dp(28)).coerceIn(0, (sh - ms).coerceAtLeast(0))
                  val v = MiniView(this, this)
                  v.lp = p
                  try { wm.addView(v, p) } catch (_: Exception) { return }
                  mini = v
                  b.visibility = View.GONE
                  prefs.edit().putBoolean("mini", true).apply()
              }
              fun restore() {
                  val m = mini ?: return
                  val mp = m.lp
                  val b = bubble
                  if (b != null && mp != null) {
                      val bp = b.lp
                      if (bp != null) {
                          val sw = resources.displayMetrics.widthPixels
                          val sh = resources.displayMetrics.heightPixels
                          bp.x = (mp.x + dp(28) - sc(90f)).coerceIn(0, (sw - sc(180f)).coerceAtLeast(0))
                          bp.y = (mp.y + dp(28) - sc(90f)).coerceIn(0, (sh - sc(200f)).coerceAtLeast(0))
                          try { wm.updateViewLayout(b, bp) } catch (_: Exception) {}
                      }
                      b.visibility = View.VISIBLE
                  }
                  try { wm.removeView(m) } catch (_: Exception) {}
                  mini = null
                  prefs.edit().putBoolean("mini", false).apply()
              }
              fun closeAll() {
                  persist()
                  prefs.edit().putBoolean("mini", false).apply()
                  hideTimerPanel()
                  timerEnd = 0L
                  timerEot = false
                  mini?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  mini = null
                  hideSpeedPanel()
                  hidePlaylistPanel()
                  bubble?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  bubble = null
                  h.removeCallbacksAndMessages(null)
                  try { mp?.release() } catch (_: Exception) {}
                  mp = null
                  ready = false
                  curUri = ""
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }
          }
          class BubbleView(ctx: Context, private val svc: PlayerService) : View(ctx) {
              var lp: WindowManager.LayoutParams? = null
              private val d = ctx.resources.displayMetrics.density * PlayerService.BS
              private val vw = 180f * d
              private val vh = 200f * d
              private val c = 90f * d
              private val ring = 54f * d
              private val pt = Paint(Paint.ANTI_ALIAS_FLAG)
              private val byBtn = 161f * d
              private var downX = 0f
              private var downY = 0f
              private var sx = 0
              private var sy = 0
              private var zone = 0
              private var moved = false
              private var tapCount = 0
              private var lastTapTime = 0L
              private var tapAngle = 0f
              private var pendingFrac = -1f
              private val clearPending = Runnable {
                  tapCount = 0
                  pendingFrac = -1f
                  invalidate()
              }
              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(vw.toInt(), vh.toInt())
              }
              private fun mark(cv: Canvas, ms: Int, duration: Int, color: String) {
                  if (duration <= 0) return
                  val a = Math.toRadians(-90.0 + 360.0 * ms.toDouble() / duration)
                  pt.color = Color.parseColor(color)
                  cv.drawCircle(
                      c + ring * Math.cos(a).toFloat(),
                      c + ring * Math.sin(a).toFloat(),
                      5 * d, pt
                  )
              }
              private fun button(cv: Canvas, x: Float, y: Float, label: String, color: String) {
                  pt.style = Paint.Style.FILL
                  pt.color = Color.parseColor(color)
                  cv.drawRoundRect(
                      RectF(x - 15*d, y - 11*d, x + 15*d, y + 11*d),
                      9*d, 9*d, pt
                  )
                  pt.color = Color.WHITE
                  pt.textAlign = Paint.Align.CENTER
                  pt.typeface = Typeface.DEFAULT_BOLD
                  pt.textSize = 11*d
                  cv.drawText(label, x, y + 4*d, pt)
              }
              override fun onDraw(cv: Canvas) {
                  super.onDraw(cv)
                  val duration = svc.dur()
                  val real = if (duration > 0) svc.pos().toFloat() / duration else 0f
                  val frac = real
                  val shownMs = svc.pos()
                  pt.style = Paint.Style.STROKE
                  pt.strokeWidth = 4*d
                  pt.color = Color.parseColor("#2A3A78")
                  cv.drawCircle(c, c, ring, pt)
                  pt.strokeCap = Paint.Cap.ROUND
                  pt.shader = SweepGradient(
                      c, c,
                      intArrayOf(
                          Color.parseColor("#FF8A4C"), Color.parseColor("#F05AE8"),
                          Color.parseColor("#3DB8F5"), Color.parseColor("#5CE06A"),
                          Color.parseColor("#FF8A4C")
                      ),
                      null
                  )
                  cv.save()
                  cv.rotate(-90f, c, c)
                  cv.drawArc(RectF(c-ring, c-ring, c+ring, c+ring), 0f, 360f*frac, false, pt)
                  cv.restore()
                  pt.shader = null
                  pt.strokeCap = Paint.Cap.BUTT
                  pt.style = Paint.Style.FILL
                  if (duration > 0) {
                      if (svc.markA >= 0) mark(cv, svc.markA, duration, "#FF4FA3")
                      if (svc.markB >= 0) mark(cv, svc.markB, duration, "#FFD23F")
                  }
                  if (pendingFrac >= 0f) {
                      val pa = Math.toRadians(-90.0 + 360.0 * pendingFrac)
                      pt.color = Color.parseColor("#4CC3FF")
                      cv.drawCircle(
                          c + ring * Math.cos(pa).toFloat(),
                          c + ring * Math.sin(pa).toFloat(),
                          (4 + tapCount) * d, pt
                      )
                  }
                  val angle = Math.toRadians(-90.0 + 360.0*frac)
                  pt.color = Color.WHITE
                  cv.drawCircle(
                      c + ring*Math.cos(angle).toFloat(),
                      c + ring*Math.sin(angle).toFloat(),
                      6*d, pt
                  )
                  pt.color = Color.parseColor("#18285E")
                  cv.drawCircle(c, c, 42*d, pt)
                  pt.style = Paint.Style.STROKE
                  pt.strokeWidth = 2*d
                  pt.color = Color.parseColor("#3C5BB0")
                  cv.drawCircle(c, c, 42*d, pt)
                  pt.style = Paint.Style.FILL
                  pt.shader = LinearGradient(
                      c-21*d, c-21*d, c+21*d, c+21*d,
                      Color.parseColor("#FF8A4C"), Color.parseColor("#F05AE8"),
                      Shader.TileMode.CLAMP
                  )
                  cv.drawCircle(c, c, 21*d, pt)
                  pt.shader = null
                  pt.color = Color.WHITE
                  if (svc.playing()) {
                      cv.drawRect(c-7*d, c-9*d, c-2*d, c+9*d, pt)
                      cv.drawRect(c+3*d, c-9*d, c+8*d, c+9*d, pt)
                  } else {
                      val path = Path()
                      path.moveTo(c-5*d, c-10*d)
                      path.lineTo(c-5*d, c+10*d)
                      path.lineTo(c+11*d, c)
                      path.close()
                      cv.drawPath(path, pt)
                  }
                  pt.color = Color.WHITE
                  pt.textAlign = Paint.Align.CENTER
                  pt.typeface = Typeface.DEFAULT_BOLD
                  pt.textSize = 18*d
                  cv.drawText("«", c-31*d, c+3*d, pt)
                  cv.drawText("»", c+31*d, c+3*d, pt)
                  pt.textSize = 9*d
                  cv.drawText("15", c-31*d, c+16*d, pt)
                  cv.drawText("15", c+31*d, c+16*d, pt)
                  if (svc.loopA >= 0 && svc.loopB > svc.loopA) {
                      pt.color = Color.parseColor("#FFD23F")
                      pt.textSize = 9*d
                      cv.drawText("A-B", c, c-28*d, pt)
                  }
                  pt.color = Color.parseColor("#1B2B5E")
                  cv.drawCircle(14*d, 14*d, 11*d, pt)
                  cv.drawCircle(vw-41*d, 14*d, 10.5f*d, pt)
                  cv.drawCircle(vw-14*d, 14*d, 11*d, pt)
                  pt.color = Color.WHITE
                  pt.textSize = 14*d
                  cv.drawText("≡", 14*d, 19*d, pt)
                  cv.drawText("−", vw-41*d, 19*d, pt)
                  cv.drawText("×", vw-14*d, 19*d, pt)
                  pt.shader = LinearGradient(
                      c-27*d, 0f, c+27*d, 0f,
                      Color.parseColor("#3DB8F5"), Color.parseColor("#8B5CF6"),
                      Shader.TileMode.CLAMP
                  )
                  cv.drawRoundRect(RectF(c-27*d, 5*d, c+27*d, 27*d), 11*d, 11*d, pt)
                  pt.shader = null
                  pt.color = Color.WHITE
                  pt.textSize = 11*d
                  cv.drawText(svc.playbackSpeedLabel(), c, 20*d, pt)
                  button(cv, c-57*d, byBtn, "A", if (svc.markA >= 0) "#E2409F" else "#26356B")
                  button(cv, c-19*d, byBtn, "B", if (svc.loopB >= 0) "#F5A524" else "#26356B")
                  button(cv, c+19*d, byBtn, "×", if (svc.loopA >= 0) "#F0506E" else "#26356B")
                  val ta = svc.timerActive()
                  button(cv, c+57*d, byBtn, if (ta) svc.timerButtonLabel() else "", if (ta) "#8B5CF6" else "#26356B")
                  if (!ta) {
                      val tx = c + 57*d
                      pt.style = Paint.Style.STROKE
                      pt.strokeWidth = 1.6f*d
                      pt.color = Color.WHITE
                      cv.drawCircle(tx, byBtn, 6*d, pt)
                      cv.drawLine(tx, byBtn - 3.5f*d, tx, byBtn, pt)
                      cv.drawLine(tx, byBtn, tx + 3*d, byBtn + 2*d, pt)
                      pt.style = Paint.Style.FILL
                  }
                  pt.style = Paint.Style.FILL
                  pt.color = Color.parseColor("#1B2B5E")
                  cv.drawRoundRect(RectF(c-52*d, 178*d, c+52*d, 198*d), 10*d, 10*d, pt)
                  pt.style = Paint.Style.STROKE
                  pt.strokeWidth = 1*d
                  pt.color = Color.parseColor("#3C5BB0")
                  cv.drawRoundRect(RectF(c-52*d, 178*d, c+52*d, 198*d), 10*d, 10*d, pt)
                  pt.style = Paint.Style.FILL
                  pt.color = if (pendingFrac >= 0f) Color.parseColor("#4CC3FF") else Color.WHITE
                  pt.textSize = 11*d
                  pt.typeface = Typeface.DEFAULT_BOLD
                  val label = if (pendingFrac >= 0f && duration > 0)
                      "→ " + fmt((pendingFrac * duration).toInt()) + "  " + tapCount + "/3"
                  else fmt(shownMs) + " / " + fmt(duration)
                  cv.drawText(label, c, 192*d, pt)
              }
              private fun tapTimeline(x: Float, y: Float) {
                  val dur = svc.dur()
                  if (dur <= 0) return
                  val ang = angleAt(x, y)
                  val now = SystemClock.uptimeMillis()
                  var diff = Math.abs(ang - tapAngle)
                  if (diff > 180f) diff = 360f - diff
                  if (tapCount > 0 && now - lastTapTime <= 700L && diff <= 20f) {
                      tapCount++
                  } else {
                      tapCount = 1
                  }
                  tapAngle = ang
                  lastTapTime = now
                  pendingFrac = ang / 360f
                  removeCallbacks(clearPending)
                  if (tapCount >= 3) {
                      svc.seekTo((pendingFrac * dur).toInt())
                      tapCount = 0
                      pendingFrac = -1f
                  } else {
                      postDelayed(clearPending, 700L)
                  }
                  invalidate()
              }
              private fun angleAt(x: Float, y: Float): Float {
                  var deg = Math.toDegrees(
                      Math.atan2((y-c).toDouble(), (x-c).toDouble())
                  ).toFloat() + 90f
                  if (deg < 0f) deg += 360f
                  if (deg >= 360f) deg -= 360f
                  return deg
              }
              private fun hit(x: Float, y: Float): Int {
                  fun dist(ax: Float, ay: Float): Float =
                      Math.hypot((x-ax).toDouble(), (y-ay).toDouble()).toFloat()
                  if (dist(vw-14*d, 14*d) < 14*d) return 4
                  if (dist(vw-41*d, 14*d) < 13*d) return 11
                  if (dist(14*d, 14*d) < 15*d) return 5
                  if (Math.abs(x-c) < 29*d && y < 30*d) return 10
                  if (dist(c-57*d, byBtn) < 18*d) return 7
                  if (dist(c-19*d, byBtn) < 18*d) return 8
                  if (dist(c+19*d, byBtn) < 18*d) return 9
                  if (dist(c+57*d, byBtn) < 18*d) return 12
                  if (dist(c, c) < 24*d) return 1
                  if (y > c-26*d && y < c+26*d) {
                      if (x > c-43*d && x < c-24*d) return 2
                      if (x > c+24*d && x < c+43*d) return 3
                  }
                  val r = dist(c, c)
                  if (r > 49*d && r < 61*d && svc.dur() > 0) return 6
                  return 0
              }
              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downX = e.rawX
                          downY = e.rawY
                          sx = lp?.x ?: 0
                          sy = lp?.y ?: 0
                          zone = hit(e.x, e.y)
                          moved = false
                          invalidate()
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          run {
                              val dx = e.rawX-downX
                              val dy = e.rawY-downY
                              if (!moved && Math.hypot(dx.toDouble(), dy.toDouble()) > 12*d) {
                                  moved = true
                              }
                              if (moved) {
                                  val p = lp
                                  if (p != null) {
                                      p.x = sx+dx.toInt()
                                      p.y = sy+dy.toInt()
                                      try { svc.wm.updateViewLayout(this, p) } catch (_: Exception) {}
                                      svc.syncVideoPanelPosition(p.x, p.y)
                                  }
                              }
                          }
                      }
                      MotionEvent.ACTION_UP -> {
                          if (moved) {
                              val q = lp
                              if (q != null) svc.savePos(q.x, q.y)
                          }
                          if (!moved) {
                              when (zone) {
                                  1 -> svc.toggle()
                                  2 -> svc.seekBy(-15000)
                                  3 -> svc.seekBy(15000)
                                  4 -> svc.closeAll()
                                  5 -> svc.showPlaylistPanel()
                                  7 -> svc.setA()
                                  8 -> svc.setB()
                                  9 -> svc.cancelAB()
                                  10 -> svc.showSpeedPicker()
                                  11 -> svc.minimize()
                                  12 -> svc.showTimerPanel()
                                  6 -> tapTimeline(e.x, e.y)
                              }
                          }
                          invalidate()
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          invalidate()
                      }
                  }
                  return true
              }
          }
          class MiniView(ctx: Context, private val svc: PlayerService) : View(ctx) {
              var lp: WindowManager.LayoutParams? = null
              private val d = ctx.resources.displayMetrics.density
              private val size = 64f * d
              private val rad = 28f * d
              private val pt = Paint(Paint.ANTI_ALIAS_FLAG)
              private val bmp = BitmapFactory.decodeResource(ctx.resources, R.drawable.ic_fg)
              private var downX = 0f
              private var downY = 0f
              private var sx = 0
              private var sy = 0
              private var moved = false
              private var onBadge = false
              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(size.toInt(), size.toInt())
              }
              override fun onDraw(cv: Canvas) {
                  super.onDraw(cv)
                  val r = rad
                  val duration = svc.dur()
                  val frac = if (duration > 0) svc.pos().toFloat() / duration else 0f
                  pt.style = Paint.Style.FILL
                  pt.color = Color.parseColor("#0F1835")
                  cv.drawCircle(r, r, r - 1*d, pt)
                  cv.save()
                  val clip = Path()
                  clip.addCircle(r, r, r - 5*d, Path.Direction.CW)
                  cv.clipPath(clip)
                  val crop = bmp.width * 0.72f
                  val off = ((bmp.width - crop) / 2f).toInt()
                  cv.drawBitmap(
                      bmp,
                      Rect(off, off, off + crop.toInt(), off + crop.toInt()),
                      RectF(0f, 0f, 2*r, 2*r),
                      pt
                  )
                  cv.restore()
                  pt.style = Paint.Style.STROKE
                  pt.strokeWidth = 3*d
                  pt.color = Color.parseColor("#2A3A78")
                  cv.drawCircle(r, r, r - 2.5f*d, pt)
                  pt.strokeCap = Paint.Cap.ROUND
                  pt.color = Color.parseColor(if (svc.playing()) "#4CC3FF" else "#9FB0DC")
                  cv.drawArc(
                      RectF(2.5f*d, 2.5f*d, 2*r-2.5f*d, 2*r-2.5f*d),
                      -90f, 360f*frac, false, pt
                  )
                  pt.strokeCap = Paint.Cap.BUTT
                  val bx = 51*d
                  val by = 51*d
                  pt.style = Paint.Style.FILL
                  pt.color = Color.parseColor("#0F1835")
                  cv.drawCircle(bx, by, 13*d, pt)
                  pt.shader = LinearGradient(
                      bx-11*d, by-11*d, bx+11*d, by+11*d,
                      Color.parseColor("#FF8A4C"), Color.parseColor("#F05AE8"),
                      Shader.TileMode.CLAMP
                  )
                  cv.drawCircle(bx, by, 11*d, pt)
                  pt.shader = null
                  pt.color = Color.WHITE
                  if (svc.playing()) {
                      cv.drawRect(bx-4.5f*d, by-5*d, bx-1.5f*d, by+5*d, pt)
                      cv.drawRect(bx+1.5f*d, by-5*d, bx+4.5f*d, by+5*d, pt)
                  } else {
                      val tri = Path()
                      tri.moveTo(bx-3*d, by-5.5f*d)
                      tri.lineTo(bx-3*d, by+5.5f*d)
                      tri.lineTo(bx+5.5f*d, by)
                      tri.close()
                      cv.drawPath(tri, pt)
                  }
              }
              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downX = e.rawX
                          downY = e.rawY
                          sx = lp?.x ?: 0
                          sy = lp?.y ?: 0
                          moved = false
                          onBadge = Math.hypot((e.x - 51*d).toDouble(), (e.y - 51*d).toDouble()) < 15*d
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = e.rawX - downX
                          val dy = e.rawY - downY
                          if (!moved && Math.hypot(dx.toDouble(), dy.toDouble()) > 10*d) moved = true
                          if (moved) {
                              val p = lp
                              if (p != null) {
                                  p.x = sx + dx.toInt()
                                  p.y = sy + dy.toInt()
                                  try { svc.wm.updateViewLayout(this, p) } catch (_: Exception) {}
                              }
                          }
                      }
                      MotionEvent.ACTION_UP -> {
                          if (!moved) {
                              if (onBadge) { svc.toggle(); invalidate() } else svc.restore()
                          }
                      }
                  }
                  return true
              }
          }
          EOF
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          :root{--bg:#0f1835;--tx:#f3f6ff;--mu:#9fb0dc;--b:#4cc3ff;--p:#f05ae8;--o:#ff8a4c;--g:#5ce06a;--line:rgba(255,255,255,.09)}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;padding:18px 14px 70px;color:var(--tx);font-family:sans-serif;min-height:100vh;
            background:radial-gradient(90% 45% at 100% 0%,rgba(139,92,246,.30),transparent 70%),
                       radial-gradient(80% 40% at 0% 100%,rgba(61,184,245,.22),transparent 70%),
                       radial-gradient(60% 30% at 0% 0%,rgba(255,138,76,.14),transparent 70%),var(--bg);
            background-attachment:fixed}
          h1{display:flex;align-items:center;gap:10px;font-size:22px;margin:2px 2px 14px}
          h1 img{width:44px;height:44px;border-radius:13px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
          h1 span{background:linear-gradient(90deg,#ff8a4c,#f05ae8 50%,#4cc3ff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
          h3{margin:20px 4px 6px;color:var(--mu);font-size:14px;font-weight:700;letter-spacing:.3px}
          .btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;margin:8px 0;font:inherit;font-weight:700;color:#fff;
            background:linear-gradient(135deg,#3aa8ff,#9a5cff 55%,#f05ae8);box-shadow:0 8px 22px rgba(154,92,255,.30);transition:transform .15s,opacity .15s}
          .btn:active{transform:scale(.97);opacity:.92}
          .btn.s{background:rgba(255,255,255,.07);border:1px solid var(--line);box-shadow:none}
          .card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin:9px 0;transition:transform .15s,background .2s}
          .card:active{transform:scale(.985)}
          .card .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .card small{display:block;color:var(--mu);margin-top:2px}
          .ic{border:0;border-radius:13px;width:40px;height:40px;font-size:17px;background:rgba(240,80,110,.16);color:var(--tx);flex-shrink:0}
          .ic.rename{background:rgba(76,195,255,.16)}
          .cur{border-color:rgba(76,195,255,.55);background:linear-gradient(135deg,rgba(76,195,255,.16),rgba(240,90,232,.12));box-shadow:0 6px 22px rgba(76,195,255,.16)}
          .note{color:var(--mu);font-size:13px;padding:8px 4px}
          </style>
          </head>
          <body>
          <h1><img src="logo.png" alt=""><span>مشغّل الدراسة</span></h1>
          <div id="app"></div>
          <script>
          let S;
          try { S = JSON.parse(localStorage.getItem('st') || 'null'); } catch (e) { S = null; }
          if (!S) { try { const bk = Android.loadState(); if (bk) S = JSON.parse(bk); } catch (e) { S = null; } }
          if (!S) S = {lists:[],last:null,open:null};
          if (!S.pos) S.pos = {};
          S.open = null;
          let target = null;
          const save = () => { const j = JSON.stringify(S); try { localStorage.setItem('st',j); } catch(e){} try { Android.saveState(j); } catch(e){} };
          const uid = () => Math.random().toString(36).slice(2,9);
          const L = id => S.lists.find(l => l.id == id);
          const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const fmt = ms => Math.floor(ms/60000)+':'+String(Math.floor(ms/1000)%60).padStart(2,'0');
          function addNew(){target=null;Android.pick();}
          function addTo(id){target=id;Android.pick();}
          function addFolder(){target=null;Android.pickFolder();}
          function addFolderTo(id){target=id;Android.pickFolder();}
          function onFolderPicked(r){
            const tr=(r.tracks||[]).map(x=>({id:uid(),name:x.name,uri:x.uri}));
            if(!tr.length)return;
            const l=target&&L(target);
            if(l){const have=new Set(l.tracks.map(t=>t.uri));l.tracks.push(...tr.filter(t=>!have.has(t.uri)));}
            else S.lists.push({id:uid(),name:r.folder||'مجلد',tracks:tr});
            save();render();
          }
          function onPicked(a){
            if(!a.length)return;
            const tr=a.map(x=>({id:uid(),name:x.name,uri:x.uri}));
            if(target&&L(target))L(target).tracks.push(...tr);
            else S.lists.push({id:uid(),name:a.length>1?'قائمة '+(S.lists.length+1):tr[0].name,tracks:tr});
            save();render();
          }
          function play(lid,tid,pos){
            const l=L(lid);if(!l)return;
            const i=l.tracks.findIndex(t=>t.id==tid);if(i<0)return;
            S.last={l:lid,t:tid,pos:pos||0};save();
            Android.play(JSON.stringify(l.tracks.map(t=>({uri:t.uri,name:t.name}))),i,pos||0);
            render();
          }
          function tap(lid,tid){play(lid,tid,(S.pos&&S.pos[tid])||(S.last&&S.last.t==tid?S.last.pos:0));}
          function resume(){const x=S.last;if(x&&L(x.l))play(x.l,x.t,x.pos);}
          function openL(id){S.open=id;render();}
          function renameL(id){
            const l=L(id);if(!l)return;
            const n=prompt('اكتب الاسم الجديد لقائمة التشغيل:',l.name);
            if(n===null)return;
            const v=n.trim();
            if(!v){alert('اكتب اسمًا غير فارغ.');return;}
            l.name=v;save();render();
          }
          function delL(id){
            if(!confirm('حذف القائمة؟'))return;
            S.lists=S.lists.filter(l=>l.id!=id);save();render();
          }
          function delT(lid,tid){
            const l=L(lid);if(!l)return;
            l.tracks=l.tracks.filter(t=>t.id!=tid);save();render();
          }
          function goBack(){
            if(S.open){S.open=null;render();return false;}
            return true;
          }
          function render(){
            const a=document.getElementById('app');
            if(!S.open){
              const x=S.last&&L(S.last.l);
              a.innerHTML='<button class="btn" onclick="addNew()">＋ إضافة صوتية / قائمة جديدة</button>'+
                '<button class="btn" onclick="addFolder()">📂 إضافة مجلد كامل</button>'+
                (x?`<button class="btn s" onclick="resume()">▶ متابعة آخر صوتية (${fmt(S.last.pos)})</button>`:'')+
                '<h3>قوائم التشغيل</h3>'+
                (S.lists.map(l=>`<div class="card${S.last&&S.last.l==l.id?' cur':''}" onclick="openL('${l.id}')"><span style="font-size:24px">📁</span><div class="t">${esc(l.name)}<small>${l.tracks.length} ملف</small></div><button class="ic rename" title="إعادة تسمية" onclick="event.stopPropagation();renameL('${l.id}')">✏️</button><button class="ic" title="حذف القائمة" onclick="event.stopPropagation();delL('${l.id}')">🗑</button></div>`).join('')||'<div class="note">لا توجد قوائم بعد. أضف صوتياتك للبدء.</div>');
            }else{
              const l=L(S.open);
              if(!l){S.open=null;render();return;}
              a.innerHTML='<button class="btn s" onclick="goBack()">→ رجوع</button>'+
                `<h3>📁 ${esc(l.name)}</h3>`+
                `<button class="btn s" onclick="renameL('${l.id}')">✏️ إعادة تسمية قائمة التشغيل</button>`+
                `<button class="btn" onclick="addTo('${l.id}')">＋ إضافة ملفات للقائمة</button>`+
                `<button class="btn" onclick="addFolderTo('${l.id}')">📂 إضافة مجلد كامل للقائمة</button>`+
                (l.tracks.map(t=>`<div class="card${S.last&&S.last.t==t.id?' cur':''}" onclick="tap('${l.id}','${t.id}')"><span style="font-size:22px">🎵</span><div class="t">${esc(t.name)}</div><button class="ic" onclick="event.stopPropagation();delT('${l.id}','${t.id}')">🗑</button></div>`).join('')||'<div class="note">القائمة فارغة.</div>');
            }
          }
          setInterval(()=>{
            try{
              const s=JSON.parse(Android.state());if(!s.uri)return;
              for(const l of S.lists){
                const t=l.tracks.find(t=>t.uri==s.uri);
                if(t){
                  const ch=!S.last||S.last.t!=t.id;
                  S.last={l:l.id,t:t.id,pos:s.pos};if(!S.pos)S.pos={};S.pos[t.id]=(s.dur&&s.pos>s.dur-3000)?0:s.pos;save();
                  if(ch)render();
                  return;
                }
              }
            }catch(e){}
          },1000);
          render();
          </script>
          </body>
          </html>
          EOF
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatPlayer-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" proj/app/build/outputs/apk/debug/app-debug.apk --title "FloatPlayer v${{ github.run_number }}" --notes "ملف التثبيت app-debug.apk"
