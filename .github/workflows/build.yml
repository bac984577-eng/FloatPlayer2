                  params.y = (((bp?.y ?: dp(150)) + sc(206f)).coerceAtMost(resources.displayMetrics.heightPixels - dp(390))).coerceAtLeast(dp(4))
                  try { wm.addView(root, params) } catch (_: Exception) { playlistPanel = null }
              }

              private fun panelButton(text: String, color: String, action: () -> Unit): Button =
                  Button(this).apply {
                      this.text = text
                      textSize = 11f
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(color))
                          cornerRadius = dp(12).toFloat()
                      }
                      setPadding(dp(2), 0, dp(2), 0)
                      setOnClickListener { action() }
                  }

              fun hidePlaylistPanel() {
                  playlistPanel?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  playlistPanel = null
              }

              private fun refreshPlaylistPanel() {
                  persist()
                  if (playlistPanel != null) showPlaylistPanel()
              }

              fun stateJson(): String = try {
                  JSONObject()
                      .put("uri", curUri)
                      .put("playing", playing())
                      .put("pos", pos())
                      .put("dur", dur())
                      .put("loopA", loopA)
                      .put("loopB", loopB)
                      .toString()
              } catch (_: Exception) { "{}" }

              fun dp(x: Int): Int = (x * resources.displayMetrics.density).toInt()

              private fun ensureBubble() {
                  if (bubble != null) return
                  val v = BubbleView(this, this)
                  val p = WindowManager.LayoutParams(
                      sc(180f), sc(200f),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  p.gravity = Gravity.TOP or Gravity.START
                  val sw0 = resources.displayMetrics.widthPixels
                  val sh0 = resources.displayMetrics.heightPixels
                  p.x = prefs.getInt("bx", sw0 - sc(200f)).coerceIn(0, (sw0 - sc(180f)).coerceAtLeast(0))
                  p.y = prefs.getInt("by", dp(150)).coerceIn(0, (sh0 - sc(200f)).coerceAtLeast(0))
                  v.lp = p
                  wm.addView(v, p)
                  bubble = v
              }

              private fun checkTimer() {
                  if (timerEnd > 0L && SystemClock.elapsedRealtime() >= timerEnd) {
                      timerEnd = 0L
                      timerEot = false
                      try { mp?.pause() } catch (_: Exception) {}
                      Toast.makeText(this, "انتهى المؤقت، تم إيقاف التشغيل", Toast.LENGTH_LONG).show()
                      bubble?.invalidate()
                  }
                  timerValue?.text = timerStatus()
              }

              fun timerLeftMs(): Long =
                  if (timerEnd > 0L) (timerEnd - SystemClock.elapsedRealtime()).coerceAtLeast(0L) else 0L

              fun timerActive(): Boolean = timerEnd > 0L || timerEot

              fun timerButtonLabel(): String =
                  if (timerEnd > 0L) Math.max(1L, (timerLeftMs() + 59999L) / 60000L).toString() else "■"

              fun timerStatus(): String = when {
                  timerEnd > 0L -> fmt(timerLeftMs().toInt())
                  timerEot -> "عند نهاية الصوتية"
                  else -> "غير مفعّل"
              }

              fun setTimer(min: Int) {
                  timerEot = false
                  timerEnd = SystemClock.elapsedRealtime() + min * 60_000L
                  Toast.makeText(this, "سيتوقف التشغيل بعد $min دقيقة", Toast.LENGTH_SHORT).show()
                  bubble?.invalidate()
              }

              fun setTimerEndOfTrack() {
                  timerEnd = 0L
                  timerEot = true
                  Toast.makeText(this, "سيتوقف التشغيل عند نهاية الصوتية", Toast.LENGTH_SHORT).show()
                  bubble?.invalidate()
              }

              fun cancelTimer() {
                  timerEnd = 0L
                  timerEot = false
                  bubble?.invalidate()
              }

              fun hideTimerPanel() {
                  timerPanel?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  timerPanel = null
                  timerValue = null
              }

              fun showTimerPanel() {
                  if (timerPanel != null) { hideTimerPanel(); return }
                  hideSpeedPanel()
                  hidePlaylistPanel()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      background = GradientDrawable().apply {
                          setColor(Color.argb(246, 15, 24, 53))
                          cornerRadius = dp(22).toFloat()
                          setStroke(dp(1), Color.argb(70, 120, 190, 255))
                      }
                  }
                  val title = TextView(this).apply {
                      text = "مؤقت الإيقاف"
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(159, 176, 220))
                  }
                  val value = TextView(this).apply {
                      text = timerStatus()
                      textSize = 26f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(92, 200, 255))
                  }
                  timerValue = value
                  root.addView(title, LinearLayout.LayoutParams(-1, dp(22)))
                  root.addView(value, LinearLayout.LayoutParams(-1, dp(44)))

                  fun chipRow(vals: IntArray) {
                      val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for (m in vals) {
                          row.addView(
                              panelButton("$m د", "#2A3A78") { setTimer(m); value.text = timerStatus() },
                              LinearLayout.LayoutParams(0, dp(40), 1f).apply { marginEnd = dp(4) }
                          )
                      }
                      root.addView(row, LinearLayout.LayoutParams(-1, dp(40)).apply { topMargin = dp(6) })
                  }
                  chipRow(intArrayOf(5, 10, 15))
                  chipRow(intArrayOf(30, 45, 60))
                  root.addView(
                      panelButton("عند نهاية الصوتية", "#8B5CF6") { setTimerEndOfTrack(); value.text = timerStatus() },
                      LinearLayout.LayoutParams(-1, dp(40)).apply { topMargin = dp(6) }
                  )
                  val bottom = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  bottom.addView(
                      panelButton("إلغاء المؤقت", "#D6455D") { cancelTimer(); value.text = timerStatus() },
                      LinearLayout.LayoutParams(0, dp(40), 1f).apply { marginEnd = dp(6) }
                  )
                  bottom.addView(
                      panelButton("إغلاق", "#2A3566") { hideTimerPanel() },
                      LinearLayout.LayoutParams(0, dp(40), 1f)
                  )
                  root.addView(bottom, LinearLayout.LayoutParams(-1, dp(40)).apply { topMargin = dp(8) })
                  timerPanel = root

                  val bp = bubble?.lp
                  val screenW = resources.displayMetrics.widthPixels
                  val screenH = resources.displayMetrics.heightPixels
                  val params = WindowManager.LayoutParams(
                      dp(280), WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = ((bp?.x ?: (screenW - sc(200f))) + sc(90f) - dp(140))
                      .coerceIn(dp(4), (screenW - dp(284)).coerceAtLeast(dp(4)))
                  params.y = ((bp?.y ?: dp(150)) + sc(206f)).coerceAtMost(screenH - dp(300)).coerceAtLeast(dp(4))
                  try { wm.addView(root, params) } catch (_: Exception) { timerPanel = null; timerValue = null }
              }

              fun persist() {
                  try {
                      val e = prefs.edit().putString("q", queue.toString()).putInt("i", idx)
                      if (ready) e.putInt("p", pos())
                      e.apply()
                  } catch (_: Exception) {}
              }

              fun savePos(x: Int, y: Int) {
                  prefs.edit().putInt("bx", x).putInt("by", y).apply()
              }

              private fun restoreSaved() {
                  if (queue.length() == 0) {
                      try {
                          queue = JSONArray(prefs.getString("q", "[]") ?: "[]")
                      } catch (_: Exception) {
                          queue = JSONArray()
                      }
                      if (queue.length() == 0) {
                          closeAll()
                          return
                      }
                      val i = prefs.getInt("i", 0).coerceIn(0, queue.length() - 1)
                      playAt(i, prefs.getInt("p", 0), false)
                      if (prefs.getBoolean("mini", false)) h.post { minimize() }
                  } else {
                      ensureBubble()
                      if (mini != null) restore()
                  }
              }

              fun toggleVisibility() {
                  if (bubble == null) return
                  if (mini != null) restore() else minimize()
              }

              fun openLists() {
                  hidePlaylistPanel()
                  try {
                      val i = Intent(this, MainActivity::class.java)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      i.putExtra("showLists", true)
                      startActivity(i)
                  } catch (_: Exception) {
                      Toast.makeText(this, "افتح التطبيق للوصول إلى القوائم", Toast.LENGTH_SHORT).show()
                  }
              }

              fun trackLabel(i: Int): String {
                  val name = queue.optJSONObject(i)?.optString("name", "صوتية") ?: "صوتية"
                  return (if (i == idx) "▶  " else "") + (i + 1) + ". " + name
              }

              fun tapTrack(i: Int) {
                  val now = SystemClock.uptimeMillis()
                  if (i == trackTapIdx && now - trackTapTime <= 700L) {
                      trackTapCount++
                  } else {
                      trackTapIdx = i
                      trackTapCount = 1
                  }
                  trackTapTime = now
                  h.removeCallbacks(resetMark)
                  if (trackTapCount >= 3) {
                      trackTapIdx = -1
                      trackTapCount = 0
                      playAt(i, 0)
                      return
                  }
                  plLabels[i]?.text = trackLabel(i) + "   " + "●".repeat(trackTapCount) + "○".repeat(3 - trackTapCount)
                  h.postDelayed(resetMark, 700L)
              }

              fun requestAddFolder() {
                  hidePlaylistPanel()
                  try {
                      val i = Intent(this, MainActivity::class.java)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      i.putExtra("pickFolderForQueue", true)
                      startActivity(i)
                  } catch (_: Exception) {
                      Toast.makeText(this, "افتح التطبيق لإضافة مجلد", Toast.LENGTH_SHORT).show()
                  }
              }

              fun sc(v: Float): Int = (v * BS * resources.displayMetrics.density).toInt()

              fun minimize() {
                  val b = bubble ?: return
                  if (mini != null) return
                  val bp = b.lp ?: return
                  hideSpeedPanel()
                  hidePlaylistPanel()
                  val ms = dp(64)
                  val sw = resources.displayMetrics.widthPixels
                  val sh = resources.displayMetrics.heightPixels
                  val p = WindowManager.LayoutParams(
                      ms, ms,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  p.gravity = Gravity.TOP or Gravity.START
                  p.x = (bp.x + sc(90f) - dp(28)).coerceIn(0, (sw - ms).coerceAtLeast(0))
                  p.y = (bp.y + sc(90f) - dp(28)).coerceIn(0, (sh - ms).coerceAtLeast(0))
                  val v = MiniView(this, this)
                  v.lp = p
                  try { wm.addView(v, p) } catch (_: Exception) { return }
                  mini = v
                  b.visibility = View.GONE
                  prefs.edit().putBoolean("mini", true).apply()
              }

              fun restore() {
                  val m = mini ?: return
                  val mp = m.lp
                  val b = bubble
                  if (b != null && mp != null) {
                      val bp = b.lp
                      if (bp != null) {
                          val sw = resources.displayMetrics.widthPixels
                          val sh = resources.displayMetrics.heightPixels
                          bp.x = (mp.x + dp(28) - sc(90f)).coerceIn(0, (sw - sc(180f)).coerceAtLeast(0))
                          bp.y = (mp.y + dp(28) - sc(90f)).coerceIn(0, (sh - sc(200f)).coerceAtLeast(0))
                          try { wm.updateViewLayout(b, bp) } catch (_: Exception) {}
                      }
                      b.visibility = View.VISIBLE
                  }
                  try { wm.removeView(m) } catch (_: Exception) {}
                  mini = null
                  prefs.edit().putBoolean("mini", false).apply()
              }

              fun closeAll() {
                  persist()
                  prefs.edit().putBoolean("mini", false).apply()
                  hideTimerPanel()
                  timerEnd = 0L
                  timerEot = false
                  mini?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  mini = null
                  hideSpeedPanel()
                  hidePlaylistPanel()
                  bubble?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  bubble = null
                  h.removeCallbacksAndMessages(null)
                  try { mp?.release() } catch (_: Exception) {}
                  mp = null
                  ready = false
                  curUri = ""
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }
          }

          class BubbleView(ctx: Context, private val svc: PlayerService) : View(ctx) {
              var lp: WindowManager.LayoutParams? = null
              private val d = ctx.resources.displayMetrics.density * PlayerService.BS
              private val vw = 180f * d
              private val vh = 200f * d
              private val c = 90f * d
              private val ring = 54f * d
              private val pt = Paint(Paint.ANTI_ALIAS_FLAG)
              private val byBtn = 161f * d
              private var downX = 0f
              private var downY = 0f
              private var sx = 0
              private var sy = 0
              private var zone = 0
              private var moved = false
              private var tapCount = 0
              private var lastTapTime = 0L
              private var tapAngle = 0f
              private var pendingFrac = -1f
              private val clearPending = Runnable {
                  tapCount = 0
                  pendingFrac = -1f
                  invalidate()
              }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(vw.toInt(), vh.toInt())
              }

              private fun mark(cv: Canvas, ms: Int, duration: Int, color: String) {
                  if (duration <= 0) return
                  val a = Math.toRadians(-90.0 + 360.0 * ms.toDouble() / duration)
                  pt.color = Color.parseColor(color)
                  cv.drawCircle(
                      c + ring * Math.cos(a).toFloat(),
                      c + ring * Math.sin(a).toFloat(),
                      5 * d, pt
                  )
              }

              private fun button(cv: Canvas, x: Float, y: Float, label: String, color: String) {
                  pt.style = Paint.Style.FILL
                  pt.color = Color.parseColor(color)
                  cv.drawRoundRect(
                      RectF(x - 15*d, y - 11*d, x + 15*d, y + 11*d),
                      9*d, 9*d, pt
                  )
                  pt.color = Color.WHITE
                  pt.textAlign = Paint.Align.CENTER
                  pt.typeface = Typeface.DEFAULT_BOLD
                  pt.textSize = 11*d
                  cv.drawText(label, x, y + 4*d, pt)
              }

              override fun onDraw(cv: Canvas) {
                  super.onDraw(cv)
                  val duration = svc.dur()
                  val real = if (duration > 0) svc.pos().toFloat() / duration else 0f
                  val frac = real
                  val shownMs = svc.pos()

                  pt.style = Paint.Style.STROKE
                  pt.strokeWidth = 4*d
                  pt.color = Color.parseColor("#2A3A78")
                  cv.drawCircle(c, c, ring, pt)

                  pt.strokeCap = Paint.Cap.ROUND
                  pt.shader = SweepGradient(
                      c, c,
                      intArrayOf(
                          Color.parseColor("#FF8A4C"), Color.parseColor("#F05AE8"),
                          Color.parseColor("#3DB8F5"), Color.parseColor("#5CE06A"),
                          Color.parseColor("#FF8A4C")
                      ),
                      null
                  )
                  cv.save()
                  cv.rotate(-90f, c, c)
                  cv.drawArc(RectF(c-ring, c-ring, c+ring, c+ring), 0f, 360f*frac, false, pt)
                  cv.restore()
                  pt.shader = null
                  pt.strokeCap = Paint.Cap.BUTT
                  pt.style = Paint.Style.FILL

                  if (duration > 0) {
                      if (svc.markA >= 0) mark(cv, svc.markA, duration, "#FF4FA3")
                      if (svc.markB >= 0) mark(cv, svc.markB, duration, "#FFD23F")
                  }

                  if (pendingFrac >= 0f) {
                      val pa = Math.toRadians(-90.0 + 360.0 * pendingFrac)
                      pt.color = Color.parseColor("#4CC3FF")
                      cv.drawCircle(
                          c + ring * Math.cos(pa).toFloat(),
                          c + ring * Math.sin(pa).toFloat(),
                          (4 + tapCount) * d, pt
                      )
                  }
                  val angle = Math.toRadians(-90.0 + 360.0*frac)
                  pt.color = Color.WHITE
                  cv.drawCircle(
                      c + ring*Math.cos(angle).toFloat(),
                      c + ring*Math.sin(angle).toFloat(),
                      6*d, pt
                  )

                  pt.color = Color.parseColor("#18285E")
                  cv.drawCircle(c, c, 42*d, pt)
                  pt.style = Paint.Style.STROKE
                  pt.strokeWidth = 2*d
                  pt.color = Color.parseColor("#3C5BB0")
                  cv.drawCircle(c, c, 42*d, pt)
                  pt.style = Paint.Style.FILL
                  pt.shader = LinearGradient(
                      c-21*d, c-21*d, c+21*d, c+21*d,
                      Color.parseColor("#FF8A4C"), Color.parseColor("#F05AE8"),
                      Shader.TileMode.CLAMP
                  )
                  cv.drawCircle(c, c, 21*d, pt)
                  pt.shader = null
                  pt.color = Color.WHITE

                  if (svc.playing()) {
                      cv.drawRect(c-7*d, c-9*d, c-2*d, c+9*d, pt)
                      cv.drawRect(c+3*d, c-9*d, c+8*d, c+9*d, pt)
                  } else {
                      val path = Path()
                      path.moveTo(c-5*d, c-10*d)
                      path.lineTo(c-5*d, c+10*d)
                      path.lineTo(c+11*d, c)
                      path.close()
                      cv.drawPath(path, pt)
                  }

                  pt.color = Color.WHITE
                  pt.textAlign = Paint.Align.CENTER
                  pt.typeface = Typeface.DEFAULT_BOLD
                  pt.textSize = 18*d
                  cv.drawText("«", c-31*d, c+3*d, pt)
                  cv.drawText("»", c+31*d, c+3*d, pt)
                  pt.textSize = 9*d
                  cv.drawText("15", c-31*d, c+16*d, pt)
                  cv.drawText("15", c+31*d, c+16*d, pt)

                  if (svc.loopA >= 0 && svc.loopB > svc.loopA) {
                      pt.color = Color.parseColor("#FFD23F")
                      pt.textSize = 9*d
                      cv.drawText("A-B", c, c-28*d, pt)
                  }

                  // أزرار الصف العلوي: قائمة، تصغير، إغلاق
                  pt.color = Color.parseColor("#1B2B5E")
                  cv.drawCircle(14*d, 14*d, 11*d, pt)
                  cv.drawCircle(vw-41*d, 14*d, 10.5f*d, pt)
                  cv.drawCircle(vw-14*d, 14*d, 11*d, pt)
                  pt.color = Color.WHITE
                  pt.textSize = 14*d
                  cv.drawText("≡", 14*d, 19*d, pt)
                  cv.drawText("−", vw-41*d, 19*d, pt)
                  cv.drawText("×", vw-14*d, 19*d, pt)

                  // شارة السرعة
                  pt.shader = LinearGradient(
                      c-27*d, 0f, c+27*d, 0f,
                      Color.parseColor("#3DB8F5"), Color.parseColor("#8B5CF6"),
                      Shader.TileMode.CLAMP
                  )
                  cv.drawRoundRect(RectF(c-27*d, 5*d, c+27*d, 27*d), 11*d, 11*d, pt)
                  pt.shader = null
                  pt.color = Color.WHITE
                  pt.textSize = 11*d
                  cv.drawText(svc.playbackSpeedLabel(), c, 20*d, pt)

                  // A / B / إلغاء
                  button(cv, c-57*d, byBtn, "A", if (svc.markA >= 0) "#E2409F" else "#26356B")
                  button(cv, c-19*d, byBtn, "B", if (svc.loopB >= 0) "#F5A524" else "#26356B")
                  button(cv, c+19*d, byBtn, "×", if (svc.loopA >= 0) "#F0506E" else "#26356B")
                  val ta = svc.timerActive()
                  button(cv, c+57*d, byBtn, if (ta) svc.timerButtonLabel() else "", if (ta) "#8B5CF6" else "#26356B")
                  if (!ta) {
                      val tx = c + 57*d
                      pt.style = Paint.Style.STROKE
                      pt.strokeWidth = 1.6f*d
                      pt.color = Color.WHITE
                      cv.drawCircle(tx, byBtn, 6*d, pt)
                      cv.drawLine(tx, byBtn - 3.5f*d, tx, byBtn, pt)
                      cv.drawLine(tx, byBtn, tx + 3*d, byBtn + 2*d, pt)
                      pt.style = Paint.Style.FILL
                  }

                  // عداد موضع التشغيل
                  pt.style = Paint.Style.FILL
                  pt.color = Color.parseColor("#1B2B5E")
                  cv.drawRoundRect(RectF(c-52*d, 178*d, c+52*d, 198*d), 10*d, 10*d, pt)
                  pt.style = Paint.Style.STROKE
                  pt.strokeWidth = 1*d
                  pt.color = Color.parseColor("#3C5BB0")
                  cv.drawRoundRect(RectF(c-52*d, 178*d, c+52*d, 198*d), 10*d, 10*d, pt)
                  pt.style = Paint.Style.FILL
                  pt.color = if (pendingFrac >= 0f) Color.parseColor("#4CC3FF") else Color.WHITE
                  pt.textSize = 11*d
                  pt.typeface = Typeface.DEFAULT_BOLD
                  val label = if (pendingFrac >= 0f && duration > 0)
                      "→ " + fmt((pendingFrac * duration).toInt()) + "  " + tapCount + "/3"
                  else fmt(shownMs) + " / " + fmt(duration)
                  cv.drawText(label, c, 192*d, pt)
              }

              private fun tapTimeline(x: Float, y: Float) {
                  val dur = svc.dur()
                  if (dur <= 0) return
                  val ang = angleAt(x, y)
                  val now = SystemClock.uptimeMillis()
                  var diff = Math.abs(ang - tapAngle)
                  if (diff > 180f) diff = 360f - diff
                  if (tapCount > 0 && now - lastTapTime <= 700L && diff <= 20f) {
                      tapCount++
                  } else {
                      tapCount = 1
                  }
                  tapAngle = ang
                  lastTapTime = now
                  pendingFrac = ang / 360f
                  removeCallbacks(clearPending)
                  if (tapCount >= 3) {
                      svc.seekTo((pendingFrac * dur).toInt())
                      tapCount = 0
                      pendingFrac = -1f
                  } else {
                      postDelayed(clearPending, 700L)
                  }
                  invalidate()
              }

              private fun angleAt(x: Float, y: Float): Float {
                  var deg = Math.toDegrees(
                      Math.atan2((y-c).toDouble(), (x-c).toDouble())
                  ).toFloat() + 90f
                  if (deg < 0f) deg += 360f
                  if (deg >= 360f) deg -= 360f
                  return deg
              }

              private fun hit(x: Float, y: Float): Int {
                  fun dist(ax: Float, ay: Float): Float =
                      Math.hypot((x-ax).toDouble(), (y-ay).toDouble()).toFloat()

                  if (dist(vw-14*d, 14*d) < 14*d) return 4
                  if (dist(vw-41*d, 14*d) < 13*d) return 11
                  if (dist(14*d, 14*d) < 15*d) return 5
                  if (Math.abs(x-c) < 29*d && y < 30*d) return 10
                  if (dist(c-57*d, byBtn) < 18*d) return 7
                  if (dist(c-19*d, byBtn) < 18*d) return 8
                  if (dist(c+19*d, byBtn) < 18*d) return 9
                  if (dist(c+57*d, byBtn) < 18*d) return 12
                  if (dist(c, c) < 24*d) return 1

                  if (y > c-26*d && y < c+26*d) {
                      if (x > c-43*d && x < c-24*d) return 2
                      if (x > c+24*d && x < c+43*d) return 3
                  }

                  val r = dist(c, c)
                  if (r > 49*d && r < 61*d && svc.dur() > 0) return 6
                  return 0
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downX = e.rawX
                          downY = e.rawY
                          sx = lp?.x ?: 0
                          sy = lp?.y ?: 0
                          zone = hit(e.x, e.y)
                          moved = false
                          invalidate()
                          return true
                      }

                      MotionEvent.ACTION_MOVE -> {
                          run {
                              val dx = e.rawX-downX
                              val dy = e.rawY-downY
                              if (!moved && Math.hypot(dx.toDouble(), dy.toDouble()) > 12*d) {
                                  moved = true
                              }
                              if (moved) {
                                  val p = lp
                                  if (p != null) {
                                      p.x = sx+dx.toInt()
                                      p.y = sy+dy.toInt()
                                      try { svc.wm.updateViewLayout(this, p) } catch (_: Exception) {}
                                  }
                              }
                          }
                      }

                      MotionEvent.ACTION_UP -> {
                          if (moved) {
                              val q = lp
                              if (q != null) svc.savePos(q.x, q.y)
                          }
                          if (!moved) {
                              when (zone) {
                                  1 -> svc.toggle()
                                  2 -> svc.seekBy(-15000)
                                  3 -> svc.seekBy(15000)
                                  4 -> svc.closeAll()
                                  5 -> svc.showPlaylistPanel()
                                  7 -> svc.setA()
                                  8 -> svc.setB()
                                  9 -> svc.cancelAB()
                                  10 -> svc.showSpeedPicker()
                                  11 -> svc.minimize()
                                  12 -> svc.showTimerPanel()
                                  6 -> tapTimeline(e.x, e.y)
                              }
                          }
                          invalidate()
                      }

                      MotionEvent.ACTION_CANCEL -> {
                          invalidate()
                      }
                  }
                  return true
              }
          }

          class MiniView(ctx: Context, private val svc: PlayerService) : View(ctx) {
              var lp: WindowManager.LayoutParams? = null
              private val d = ctx.resources.displayMetrics.density
              private val size = 64f * d
              private val rad = 28f * d
              private val pt = Paint(Paint.ANTI_ALIAS_FLAG)
              private val bmp = BitmapFactory.decodeResource(ctx.resources, R.drawable.ic_fg)
              private var downX = 0f
              private var downY = 0f
              private var sx = 0
              private var sy = 0
              private var moved = false
              private var onBadge = false

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(size.toInt(), size.toInt())
              }

              override fun onDraw(cv: Canvas) {
                  super.onDraw(cv)
                  val r = rad
                  val duration = svc.dur()
                  val frac = if (duration > 0) svc.pos().toFloat() / duration else 0f

                  pt.style = Paint.Style.FILL
                  pt.color = Color.parseColor("#0F1835")
                  cv.drawCircle(r, r, r - 1*d, pt)

                  cv.save()
                  val clip = Path()
                  clip.addCircle(r, r, r - 5*d, Path.Direction.CW)
                  cv.clipPath(clip)
                  val crop = bmp.width * 0.72f
                  val off = ((bmp.width - crop) / 2f).toInt()
                  cv.drawBitmap(
                      bmp,
                      Rect(off, off, off + crop.toInt(), off + crop.toInt()),
                      RectF(0f, 0f, 2*r, 2*r),
                      pt
                  )
                  cv.restore()

                  pt.style = Paint.Style.STROKE
                  pt.strokeWidth = 3*d
                  pt.color = Color.parseColor("#2A3A78")
                  cv.drawCircle(r, r, r - 2.5f*d, pt)
                  pt.strokeCap = Paint.Cap.ROUND
                  pt.color = Color.parseColor(if (svc.playing()) "#4CC3FF" else "#9FB0DC")
                  cv.drawArc(
                      RectF(2.5f*d, 2.5f*d, 2*r-2.5f*d, 2*r-2.5f*d),
                      -90f, 360f*frac, false, pt
                  )
                  pt.strokeCap = Paint.Cap.BUTT

                  // زر التشغيل / الإيقاف
                  val bx = 51*d
                  val by = 51*d
                  pt.style = Paint.Style.FILL
                  pt.color = Color.parseColor("#0F1835")
                  cv.drawCircle(bx, by, 13*d, pt)
                  pt.shader = LinearGradient(
                      bx-11*d, by-11*d, bx+11*d, by+11*d,
                      Color.parseColor("#FF8A4C"), Color.parseColor("#F05AE8"),
                      Shader.TileMode.CLAMP
                  )
                  cv.drawCircle(bx, by, 11*d, pt)
                  pt.shader = null
                  pt.color = Color.WHITE
                  if (svc.playing()) {
                      cv.drawRect(bx-4.5f*d, by-5*d, bx-1.5f*d, by+5*d, pt)
                      cv.drawRect(bx+1.5f*d, by-5*d, bx+4.5f*d, by+5*d, pt)
                  } else {
                      val tri = Path()
                      tri.moveTo(bx-3*d, by-5.5f*d)
                      tri.lineTo(bx-3*d, by+5.5f*d)
                      tri.lineTo(bx+5.5f*d, by)
                      tri.close()
                      cv.drawPath(tri, pt)
                  }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downX = e.rawX
                          downY = e.rawY
                          sx = lp?.x ?: 0
                          sy = lp?.y ?: 0
                          moved = false
                          onBadge = Math.hypot((e.x - 51*d).toDouble(), (e.y - 51*d).toDouble()) < 15*d
                          return true
                      }
                      MotionEvent.ACTION_MOVE -> {
                          val dx = e.rawX - downX
                          val dy = e.rawY - downY
                          if (!moved && Math.hypot(dx.toDouble(), dy.toDouble()) > 10*d) moved = true
                          if (moved) {
                              val p = lp
                              if (p != null) {
                                  p.x = sx + dx.toInt()
                                  p.y = sy + dy.toInt()
                                  try { svc.wm.updateViewLayout(this, p) } catch (_: Exception) {}
                              }
                          }
                      }
                      MotionEvent.ACTION_UP -> {
                          if (!moved) {
                              if (onBadge) { svc.toggle(); invalidate() } else svc.restore()
                          }
                      }
                  }
                  return true
              }
          }
          EOF

