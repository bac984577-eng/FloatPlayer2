                  bubble?.invalidate()
              }

              fun setB() {
                  if (!ready) return
                  if (markA < 0) {
                      Toast.makeText(this, "حدّد A أولًا", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val b = pos()
                  if (b <= markA + 100) {
                      Toast.makeText(this, "يجب أن تكون B بعد A", Toast.LENGTH_SHORT).show()
                      return
                  }
                  markB = b
                  loopA = markA
                  loopB = markB
                  seekTo(loopA)
                  if (!playing()) {
                      try { mp?.start() } catch (_: Exception) {}
                  }
                  Toast.makeText(this, "بدأ التكرار بين A وB", Toast.LENGTH_SHORT).show()
                  bubble?.invalidate()
              }

              fun cancelAB(showMessage: Boolean = true) {
                  val active = loopA >= 0
                  loopA = -1
                  loopB = -1
                  markA = -1
                  markB = -1
                  if (showMessage && active) {
                      Toast.makeText(
                          this, "أُلغي A-B، يستمر التشغيل العادي", Toast.LENGTH_SHORT
                      ).show()
                  }
                  bubble?.invalidate()
              }


              fun appendTracks(items: JSONArray) {
                  val wasEmpty = queue.length() == 0
                  for (i in 0 until items.length()) {
                      val item = items.optJSONObject(i) ?: continue
                      queue.put(JSONObject().put("uri", item.optString("uri"))
                          .put("name", item.optString("name", "صوتية")))
                  }
                  Toast.makeText(this, "أُضيفت ${items.length()} صوتية إلى قائمة التشغيل", Toast.LENGTH_SHORT).show()
                  if (wasEmpty && queue.length() > 0) playAt(0, 0)
                  refreshPlaylistPanel()
                  bubble?.invalidate()
              }

              fun moveTrack(from: Int, to: Int) {
                  if (from !in 0 until queue.length() || to !in 0 until queue.length()) return
                  if (from == to) return
                  val arr = ArrayList<JSONObject>()
                  for (i in 0 until queue.length()) arr.add(queue.getJSONObject(i))
                  val item = arr.removeAt(from)
                  arr.add(to, item)
                  queue = JSONArray()
                  arr.forEach { queue.put(it) }
                  idx = when {
                      idx == from -> to
                      from < idx && to >= idx -> idx - 1
                      from > idx && to <= idx -> idx + 1
                      else -> idx
                  }
                  refreshPlaylistPanel()
                  bubble?.invalidate()
              }

              fun removeTrack(at: Int) {
                  if (at !in 0 until queue.length()) return
                  val removingCurrent = at == idx
                  val arr = ArrayList<JSONObject>()
                  for (i in 0 until queue.length()) if (i != at) arr.add(queue.getJSONObject(i))
                  queue = JSONArray()
                  arr.forEach { queue.put(it) }
                  if (queue.length() == 0) {
                      idx = 0
                      try { mp?.release() } catch (_: Exception) {}
                      mp = null
                      ready = false
                      curUri = ""
                      curName = ""
                      cancelAB(false)
                      refreshPlaylistPanel()
                      bubble?.invalidate()
                      return
                  }
                  if (removingCurrent) {
                      idx = at.coerceAtMost(queue.length() - 1)
                      playAt(idx, 0)
                  } else {
                      if (at < idx) idx--
                      refreshPlaylistPanel()
                  }
                  bubble?.invalidate()
              }

