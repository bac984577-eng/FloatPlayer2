              private fun checkTimer() {
                  if (timerEnd > 0L && SystemClock.elapsedRealtime() >= timerEnd) {
                      timerEnd = 0L
                      timerEot = false
                      try { mp?.pause() } catch (_: Exception) {}
                      Toast.makeText(this, "انتهى المؤقت، تم إيقاف التشغيل", Toast.LENGTH_LONG).show()
                      bubble?.invalidate()
                  }
                  timerValue?.text = timerStatus()
              }
              fun timerLeftMs(): Long =
                  if (timerEnd > 0L) (timerEnd - SystemClock.elapsedRealtime()).coerceAtLeast(0L) else 0L
              fun timerActive(): Boolean = timerEnd > 0L || timerEot
              fun timerButtonLabel(): String =
                  if (timerEnd > 0L) Math.max(1L, (timerLeftMs() + 59999L) / 60000L).toString() else "■"
              fun timerStatus(): String = when {
                  timerEnd > 0L -> fmt(timerLeftMs().toInt())
                  timerEot -> "عند نهاية الصوتية"
                  else -> "غير مفعّل"
