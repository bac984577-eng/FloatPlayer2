              fun persist() {
                  try {
                      val e = prefs.edit().putString("q", queue.toString()).putInt("i", idx)
                      if (ready) e.putInt("p", pos())
                      e.apply()
                  } catch (_: Exception) {}
              }
              fun savePos(x: Int, y: Int) {
                  prefs.edit().putInt("bx", x).putInt("by", y).apply()
              }
              private fun restoreSaved() {
                  if (queue.length() == 0) {
                      try {
                          queue = JSONArray(prefs.getString("q", "[]") ?: "[]")
                      } catch (_: Exception) {
                          queue = JSONArray()
                      }
                      if (queue.length() == 0) {
                          closeAll()
                          return
                      }
                      val i = prefs.getInt("i", 0).coerceIn(0, queue.length() - 1)
                      playAt(i, prefs.getInt("p", 0), false)
                      if (prefs.getBoolean("mini", false)) h.post { minimize() }
                  } else {
                      ensureBubble()
                      if (mini != null) restore()
                  }
              }
              fun toggleVisibility() {
                  if (bubble == null) return
                  if (mini != null) restore() else minimize()
              }
              fun openLists() {
