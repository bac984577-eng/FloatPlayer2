name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          mkdir -p proj/app/src/main/java/com/floatplayer proj/app/src/main/assets proj/app/src/main/res/values proj/app/src/main/res/drawable
          cd proj

          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'FloatPlayer'
          include ':app'
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          GRADLE

          cat > gradle.properties <<'GRADLE'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.floatplayer'
              compileSdk 34
              defaultConfig { applicationId 'com.floatplayer'; minSdk 26; targetSdk 33; versionCode 2; versionName '1.1' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="مشغّل الدراسة" android:icon="@drawable/ic_launcher" android:allowBackup="false" android:supportsRtl="true" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden" android:windowSoftInputMode="adjustResize">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name=".PlayerService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>
              </application>
          </manifest>
          XML

          cat > app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#10182B" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#66E3CF" android:pathData="M54,12 C66,12 73,24 73,34 C73,43 65,49 54,54 C43,49 35,43 35,34 C35,24 42,12 54,12 Z"/>
              <path android:fillColor="#8B7CFF" android:pathData="M96,54 C96,66 84,73 74,73 C65,73 59,65 54,54 C59,43 65,35 74,35 C84,35 96,42 96,54 Z"/>
              <path android:fillColor="#FF7892" android:pathData="M54,96 C42,96 35,84 35,74 C35,65 43,59 54,54 C65,59 73,65 73,74 C73,84 66,96 54,96 Z"/>
              <path android:fillColor="#FFC857" android:pathData="M12,54 C12,42 24,35 34,35 C43,35 49,43 54,54 C49,65 43,73 34,73 C24,73 12,66 12,54 Z"/>
              <circle android:fillColor="#FFFFFF" android:cx="54" android:cy="54" android:radius="9"/>
          </vector>
          XML

          cat > app/src/main/res/values/styles.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"><item name="android:fontFamily">sans</item><item name="android:colorAccent">#66E3CF</item><item name="android:statusBarColor">#0B1424</item><item name="android:navigationBarColor">#0B1424</item><item name="android:windowLightStatusBar">false</item></style></resources>
          XML

          cat > app/src/main/java/com/floatplayer/MainActivity.kt <<'KOTLIN'
          package com.floatplayer

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : Activity() {
              private lateinit var web: WebView
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(11,20,36)
                  window.navigationBarColor = Color.rgb(11,20,36)
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.webChromeClient = WebChromeClient()
                  web.setBackgroundColor(Color.rgb(11,20,36))
                  web.addJavascriptInterface(Bridge(), "Android")
                  setContentView(web)
                  web.loadUrl("file:///android_asset/index.html")
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
              }
              private fun pickAudio() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE); type = "audio/*"
                      putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                  }
                  startActivityForResult(i, 7)
              }
              private fun nameOf(uri: Uri): String {
                  var name = "صوتية"
                  try { contentResolver.query(uri, null, null, null, null)?.use { c -> if (c.moveToFirst()) { val ix=c.getColumnIndex(OpenableColumns.DISPLAY_NAME); if(ix>=0) name=c.getString(ix) } } } catch (_: Exception) {}
                  return name.substringBeforeLast('.')
              }
              @Deprecated("Deprecated in Android")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != 7 || resultCode != RESULT_OK || data == null) return
                  val uris = ArrayList<Uri>()
                  data.clipData?.let { clip -> for (i in 0 until clip.itemCount) uris.add(clip.getItemAt(i).uri) } ?: data.data?.let { uris.add(it) }
                  val arr = JSONArray()
                  for (u in uris) {
                      try { contentResolver.takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                      arr.put(JSONObject().put("uri",u.toString()).put("name",nameOf(u)))
                  }
                  web.evaluateJavascript("onPicked(${arr.toString()})", null)
              }
              override fun onBackPressed() { web.evaluateJavascript("goBack()") { if (it == "true") finish() } }
              inner class Bridge {
                  @JavascriptInterface fun pick() { runOnUiThread { pickAudio() } }
                  @JavascriptInterface fun requestOverlay() { runOnUiThread { if (!Settings.canDrawOverlays(this@MainActivity)) startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))) } }
                  @JavascriptInterface fun play(queue: String, index: Int, position: Int) {
                      runOnUiThread {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(this@MainActivity,"فعّل السماح بالظهور فوق التطبيقات أولًا",Toast.LENGTH_LONG).show()
                              startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                              return@runOnUiThread
                          }
                          val i=Intent(this@MainActivity,PlayerService::class.java).putExtra("queue",queue).putExtra("idx",index).putExtra("pos",position)
                          if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                      }
                  }
                  @JavascriptInterface fun toggle() { runOnUiThread { PlayerService.inst?.toggle() } }
                  @JavascriptInterface fun stop() { runOnUiThread { PlayerService.inst?.stopTrack() } }
                  @JavascriptInterface fun next() { runOnUiThread { PlayerService.inst?.nextTrack() } }
                  @JavascriptInterface fun previous() { runOnUiThread { PlayerService.inst?.previousTrack() } }
                  @JavascriptInterface fun seekTo(ms: Int) { runOnUiThread { PlayerService.inst?.seekTo(ms) } }
                  @JavascriptInterface fun speed(value: Float) { runOnUiThread { PlayerService.inst?.setSpeed(value) } }
                  @JavascriptInterface fun state(): String = PlayerService.inst?.stateJson() ?: "{}"
              }
          }
          KOTLIN

          cat > app/src/main/java/com/floatplayer/PlayerService.kt <<'KOTLIN'
          package com.floatplayer

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject

          class PlayerService : Service() {
              companion object { var inst: PlayerService? = null }
              private lateinit var wm: WindowManager
              private var mp: MediaPlayer? = null
              private var ready=false
              private var bubble: TextView?=null
              private var panel: View?=null
              private var panelKind=""
              private var queue=JSONArray()
              private var idx=0
              private var curUri=""
              private var curName=""
              private var speed=1f
              private var loopA=-1
              private var loopB=-1
              private val h=Handler(Looper.getMainLooper())
              private val tick=object:Runnable { override fun run(){ try { if(ready && mp?.isPlaying==true && loopA>=0 && loopB>loopA && (mp?.currentPosition?:0)>=loopB) mp?.seekTo(loopA); bubble?.text=if(ready && mp?.isPlaying==true) "Ⅱ" else "▶" } catch (_:Exception){}; h.postDelayed(this,250) } }
              override fun onBind(intent: Intent?): IBinder?=null
              override fun onCreate(){ super.onCreate(); inst=this; wm=getSystemService(WINDOW_SERVICE) as WindowManager; val nm=getSystemService(NOTIFICATION_SERVICE) as NotificationManager; nm.createNotificationChannel(NotificationChannel("player","مشغّل الدراسة",NotificationManager.IMPORTANCE_LOW)); h.post(tick) }
              private fun notification(title:String)=Notification.Builder(this,"player").setSmallIcon(android.R.drawable.ic_media_play).setContentTitle(title).setContentText("مشغّل الدراسة يعمل").setOngoing(true).build()
              override fun onStartCommand(intent:Intent?,flags:Int,startId:Int):Int { startForeground(1,notification(curName.ifEmpty { "مشغّل الدراسة" })); if(intent?.hasExtra("queue")==true){ queue=JSONArray(intent.getStringExtra("queue")); playAt(intent.getIntExtra("idx",0),intent.getIntExtra("pos",0)) }; return START_NOT_STICKY }
              private fun playAt(index:Int, position:Int){ if(index !in 0 until queue.length()) return; idx=index; val item=queue.getJSONObject(index); curUri=item.optString("uri"); curName=item.optString("name","صوتية"); loopA=-1; loopB=-1; ready=false; try{mp?.release()}catch(_:Exception){}; val player=MediaPlayer(); mp=player; try{ player.setDataSource(this,Uri.parse(curUri)); player.setOnPreparedListener { p -> ready=true; try{p.playbackParams=p.playbackParams.setSpeed(speed)}catch(_:Exception){}; if(position>0)p.seekTo(position.coerceAtMost(p.duration)); p.start(); bubble?.text="Ⅱ" }; player.setOnCompletionListener { if(idx+1<queue.length()) playAt(idx+1,0) else stopTrack() }; player.setOnErrorListener { _,_,_-> ready=false; true }; player.prepareAsync() }catch(_:Exception){ ready=false; Toast.makeText(this,"تعذّر تشغيل الملف",Toast.LENGTH_SHORT).show() }; (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).notify(1,notification(curName)); ensureBubble() }
              private fun ensureBubble(){ if(bubble!=null)return; val b=TextView(this).apply{ text="▶"; textSize=24f; gravity=Gravity.CENTER; setTextColor(Color.WHITE); background=GradientDrawable().apply{shape=GradientDrawable.OVAL;setColor(Color.rgb(101,86,217));setStroke(dp(2),Color.rgb(102,227,207))}; setOnClickListener{toggle()}; setOnLongClickListener{showPanel("main");true} }; val p=WindowManager.LayoutParams(dp(62),dp(62),WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,PixelFormat.TRANSLUCENT); p.gravity=Gravity.TOP or Gravity.START;p.x=resources.displayMetrics.widthPixels-dp(82);p.y=dp(180); var dx=0f;var dy=0f;var sx=0;var sy=0; b.setOnTouchListener { v,e -> when(e.action){MotionEvent.ACTION_DOWN->{dx=e.rawX;dy=e.rawY;sx=p.x;sy=p.y;true};MotionEvent.ACTION_MOVE->{val mx=e.rawX-dx;val my=e.rawY-dy;if(kotlin.math.abs(mx)>8||kotlin.math.abs(my)>8){p.x=sx+mx.toInt();p.y=sy+my.toInt();try{wm.updateViewLayout(v,p)}catch(_:Exception){}};true};MotionEvent.ACTION_UP->{if(kotlin.math.abs(e.rawX-dx)<8&&kotlin.math.abs(e.rawY-dy)<8){if(e.eventTime-e.downTime>500) showPanel("main") else toggle()};true};else->true} }; wm.addView(b,p);bubble=b }
              private fun dp(v:Int)=(v*resources.displayMetrics.density).toInt()
              fun toggle(){ if(!ready){if(curUri.isNotEmpty())playAt(idx,0);return};try{if(mp?.isPlaying==true)mp?.pause() else mp?.start()}catch(_:Exception){};bubble?.text=if(mp?.isPlaying==true)"Ⅱ" else "▶" }
              fun stopTrack(){ try{mp?.stop()}catch(_:Exception){};try{mp?.release()}catch(_:Exception){};mp=null;ready=false;loopA=-1;loopB=-1;bubble?.text="▶"; (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).notify(1,notification("تم إيقاف الصوتية")) }
              fun nextTrack(){if(idx+1<queue.length())playAt(idx+1,0)else stopTrack()}
              fun previousTrack(){if(ready&&(mp?.currentPosition?:0)>3000)seekTo(0)else if(idx>0)playAt(idx-1,0)else seekTo(0)}
              fun seekTo(ms:Int){if(ready)try{mp?.seekTo(ms.coerceIn(0,mp?.duration?:0))}catch(_:Exception){}}
              fun setSpeed(v:Float){speed=(kotlin.math.round(v*20)/20f).coerceIn(0.5f,3f);if(ready)try{mp?.playbackParams=mp!!.playbackParams.setSpeed(speed)}catch(_:Exception){} }
              private fun pos()=try{if(ready)mp?.currentPosition?:0 else 0}catch(_:Exception){0}
              private fun dur()=try{if(ready)mp?.duration?:0 else 0}catch(_:Exception){0}
              fun stateJson()=JSONObject().put("uri",curUri).put("name",curName).put("playing",ready&&(mp?.isPlaying==true)).put("pos",pos()).put("dur",dur()).put("speed",speed).toString()
              private fun btn(text:String, action:()->Unit)=Button(this).apply{this.text=text;isAllCaps=false;setTextColor(Color.WHITE);background=GradientDrawable().apply{setColor(Color.rgb(38,59,87));cornerRadius=dp(12).toFloat()};setOnClickListener{action()} }
              private fun showPanel(kind:String){ hidePanel();panelKind=kind;val root=LinearLayout(this).apply{orientation=LinearLayout.VERTICAL;setPadding(dp(14),dp(12),dp(14),dp(12));background=GradientDrawable().apply{setColor(Color.rgb(17,30,50));cornerRadius=dp(20).toFloat();setStroke(dp(1),Color.rgb(102,227,207))} }; val title=TextView(this).apply{text=if(kind=="speed")"سرعة التشغيل" else "التحكم بالصوتية";textSize=18f;typeface=Typeface.DEFAULT_BOLD;setTextColor(Color.WHITE);gravity=Gravity.CENTER;setPadding(0,0,0,dp(8))};root.addView(title);if(kind=="speed"){ for(v in listOf(0.5f,0.75f,1f,1.25f,1.5f,2f,2.5f,3f)) root.addView(btn("${v}×"){setSpeed(v);hidePanel()}) }else{root.addView(btn("▶ / إيقاف مؤقت"){toggle()});root.addView(btn("⏮ السابق"){previousTrack()});root.addView(btn("⏭ التالي"){nextTrack()});root.addView(btn("■ إيقاف نهائي"){stopTrack()});root.addView(btn("سرعة التشغيل ${speed}×"){showPanel("speed")});root.addView(btn("إغلاق المشغّل العائم"){closeAll()})};root.addView(btn("إغلاق"){hidePanel()});root.setOnTouchListener { _,e -> if(e.action==MotionEvent.ACTION_OUTSIDE){hidePanel();true}else false };val p=WindowManager.LayoutParams(dp(260),WindowManager.LayoutParams.WRAP_CONTENT,WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,PixelFormat.TRANSLUCENT);p.gravity=Gravity.TOP or Gravity.START;p.x=(resources.displayMetrics.widthPixels-dp(280)).coerceAtLeast(dp(4));p.y=dp(160);panel=root;try{wm.addView(root,p)}catch(_:Exception){panel=null} }
              private fun hidePanel(){panel?.let{try{wm.removeView(it)}catch(_:Exception){}};panel=null;panelKind=""}
              private fun closeAll(){hidePanel();bubble?.let{try{wm.removeView(it)}catch(_:Exception){}};bubble=null;stopTrack();stopForeground(STOP_FOREGROUND_REMOVE);stopSelf()}
              override fun onDestroy(){hidePanel();h.removeCallbacksAndMessages(null);try{mp?.release()}catch(_:Exception){};bubble?.let{try{wm.removeView(it)}catch(_:Exception){}};bubble=null;inst=null;super.onDestroy()}
          }
          KOTLIN

          cat > app/src/main/assets/index.html <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>
          :root{--bg:#0b1424;--card:#16243a;--tx:#f4f7ff;--mu:#a5b4cc;--mint:#66e3cf;--violet:#8b7cff;--red:#a83e55}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;padding:18px 14px 50px;color:var(--tx);font-family:sans-serif;background:radial-gradient(ellipse at top,#203858 0%,var(--bg) 70%)}h1{font-size:22px;color:var(--mint);margin:5px 0 15px}h3{margin:18px 4px 8px}.btn{width:100%;border:0;border-radius:15px;padding:13px;margin:6px 0;font:inherit;font-weight:bold;color:white;background:linear-gradient(135deg,#238f9c,#6556d9)}.btn.secondary{background:#1a2b43;border:1px solid #66e3cf40}.card{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#192b43,#142137);border:1px solid #ffffff0c;border-radius:17px;padding:11px;margin:8px 0}.card .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card small{display:block;color:var(--mu);margin-top:4px}.ic{border:0;border-radius:12px;width:39px;height:39px;font-size:16px;background:#8d354833;color:var(--tx);flex-shrink:0}.ic.rename{background:#66e3cf24}.cur{outline:2px solid var(--mint)}.note{color:var(--mu);font-size:13px;padding:6px 4px}.player{background:linear-gradient(145deg,#1c304b,#121e32);border:1px solid #ffffff18;border-radius:23px;padding:16px;margin:12px 0 20px;box-shadow:0 12px 30px #0003}.player-head{display:flex;align-items:center;gap:10px}.player-icon{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;color:#0b1424;background:linear-gradient(135deg,var(--mint),var(--violet));font-size:27px}.player-info{flex:1;min-width:0}.player-info span{display:block;color:var(--mu);font-size:12px;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{color:var(--mint);font-size:12px}#audioSeek{width:100%;accent-color:var(--mint);margin:18px 0 0}.times{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}.controls{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:14px}.controls button{border:1px solid #ffffff18;border-radius:12px;padding:10px;color:var(--tx);background:#263b57;font:inherit;font-weight:bold}.controls .play{width:49px;height:45px;background:var(--mint);color:#0b1424;font-size:20px}.controls .stop{background:#8d3548;color:#fff0f2}
          </style></head><body><h1>🎧 مشغّل الدراسة</h1><section class="player"><div class="player-head"><span class="player-icon">♫</span><div class="player-info"><strong>المشغّل الصوتي</strong><span id="nowName">لا توجد صوتية قيد التشغيل</span></div><span id="playState" class="status">متوقف</span></div><input id="audioSeek" type="range" min="0" max="0" value="0"><div class="times"><span id="audioPos">0:00</span><span id="audioDur">0:00</span></div><div class="controls"><button onclick="Android.previous()">⏮</button><button class="play" id="mainPlay" onclick="Android.toggle()">▶</button><button onclick="Android.next()">⏭</button><button class="stop" onclick="Android.stop()">■ إيقاف</button></div><div class="controls"><button onclick="setSpeed()">سرعة التشغيل</button><button onclick="requestOverlay()">تفعيل المشغّل العائم</button></div></section><div id="app"></div><script>
          let S;try{S=JSON.parse(localStorage.getItem('st')||'null')}catch(e){S=null}if(!S)S={lists:[],last:null,open:null};let target=null,seeking=false;const save=()=>localStorage.setItem('st',JSON.stringify(S));const uid=()=>Math.random().toString(36).slice(2,9);const L=id=>S.lists.find(l=>l.id===id);const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const fmt=ms=>Math.floor(Math.max(0,ms)/60000)+':'+String(Math.floor(Math.max(0,ms)/1000)%60).padStart(2,'0');
          function requestOverlay(){Android.requestOverlay()}function setSpeed(){const v=prompt('سرعة التشغيل من 0.5 إلى 3', '1');if(v!==null){const n=Number(v);if(n>=.5&&n<=3)Android.speed(n)}}
          function onPicked(json){let a;try{a=typeof json==='string'?JSON.parse(json):json}catch(e){return}if(!a||!a.length)return;const tracks=a.map(x=>({id:uid(),name:x.name,uri:x.uri}));if(target&&L(target))L(target).tracks.push(...tracks);else S.lists.push({id:uid(),name:a.length>1?'قائمة '+(S.lists.length+1):tracks[0].name,tracks});target=null;save();render()}
          function addNew(){target=null;Android.pick()}function addTo(id){target=id;Android.pick()}function play(lid,tid,pos=0){const l=L(lid);if(!l)return;const i=l.tracks.findIndex(t=>t.id===tid);if(i<0)return;S.last={l:lid,t:tid,pos};save();Android.play(JSON.stringify(l.tracks.map(t=>({uri:t.uri,name:t.name}))),i,pos);render()}function resume(){if(S.last)play(S.last.l,S.last.t,S.last.pos||0)}function openL(id){S.open=id;render()}function goBack(){if(S.open){S.open=null;render();return false}return true}
          function renameL(id){const l=L(id);if(!l)return;const n=prompt('اسم القائمة',l.name);if(n!==null&&n.trim()){l.name=n.trim();save();render()}}function delL(id){if(confirm('حذف قائمة التشغيل؟')){S.lists=S.lists.filter(l=>l.id!==id);save();render()}}function delT(lid,tid){const l=L(lid);if(l){l.tracks=l.tracks.filter(t=>t.id!==tid);save();render()}}
          function render(){const a=document.getElementById('app');if(!S.open){const x=S.last&&L(S.last.l);a.innerHTML='<button class="btn" onclick="addNew()">＋ إضافة صوتية / قائمة جديدة</button>'+(x?'<button class="btn secondary" onclick="resume()">▶ متابعة آخر صوتية</button>':'')+'<h3>قوائم التشغيل</h3>'+(S.lists.map(l=>`<div class="card${S.last&&S.last.l===l.id?' cur':''}" onclick="openL('${l.id}')"><span style="font-size:24px">📁</span><div class="t">${esc(l.name)}<small>${l.tracks.length} ملف</small></div><button class="ic rename" onclick="event.stopPropagation();renameL('${l.id}')">✏️</button><button class="ic" onclick="event.stopPropagation();delL('${l.id}')">🗑</button></div>`).join('')||'<div class="note">لا توجد قوائم بعد. أضف صوتياتك للبدء.</div>')}';return}const l=L(S.open);if(!l){S.open=null;render();return}a.innerHTML='<button class="btn secondary" onclick="goBack()">→ رجوع</button>'+`<h3>📁 ${esc(l.name)}</h3><button class="btn secondary" onclick="renameL('${l.id}')">✏️ إعادة تسمية</button><button class="btn" onclick="addTo('${l.id}')">＋ إضافة ملفات</button>`+(l.tracks.map(t=>`<div class="card${S.last&&S.last.t===t.id?' cur':''}" onclick="play('${l.id}','${t.id}')"><span style="font-size:22px">🎵</span><div class="t">${esc(t.name)}</div><button class="ic" onclick="event.stopPropagation();delT('${l.id}','${t.id}')">🗑</button></div>`).join('')||'<div class="note">القائمة فارغة.</div>')}
          document.getElementById('audioSeek').addEventListener('pointerdown',()=>seeking=true);document.getElementById('audioSeek').addEventListener('change',e=>{Android.seekTo(Number(e.target.value));seeking=false});document.getElementById('audioSeek').addEventListener('pointerup',()=>seeking=false);
          function updatePlayer(s){document.getElementById('nowName').textContent=s.name||'لا توجد صوتية قيد التشغيل';document.getElementById('playState').textContent=s.playing?'قيد التشغيل':(s.uri&&s.dur>0?'متوقف مؤقتًا':'متوقف');document.getElementById('mainPlay').textContent=s.playing?'Ⅱ':'▶';const seek=document.getElementById('audioSeek');seek.max=Math.max(0,s.dur||0);if(!seeking)seek.value=s.pos||0;document.getElementById('audioPos').textContent=fmt(s.pos||0);document.getElementById('audioDur').textContent=fmt(s.dur||0)}
          setInterval(()=>{try{const s=JSON.parse(Android.state());updatePlayer(s);if(!s.uri)return;for(const l of S.lists){const t=l.tracks.find(t=>t.uri===s.uri);if(t){const changed=!S.last||S.last.t!==t.id;S.last={l:l.id,t:t.id,pos:s.pos};save();if(changed)render();return}}}catch(e){}},500);render();
          </script></body></html>
