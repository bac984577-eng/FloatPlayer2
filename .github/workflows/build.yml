name: Build Arabic Audio Player APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/example/sawti app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SawtiAudioPlayer"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.sawti"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.sawti"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildFeatures { buildConfig = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:allowBackup="true"
                  android:label="صوتي - مشغّل الصوت"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PlaybackService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback" />
                  <service
                      android:name=".FloatingWidgetService"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6C63FF</item>
                  <item name="android:navigationBarColor">#101426</item>
                  <item name="android:statusBarColor">#101426</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/sawti/PlaybackService.kt <<'EOF'
          package com.example.sawti

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.widget.Toast
          import org.json.JSONArray
          import java.io.IOException

          class PlaybackService : Service() {
              companion object {
                  const val ACTION_ADD = "com.example.sawti.ADD"
                  const val ACTION_PLAY_INDEX = "com.example.sawti.PLAY_INDEX"
                  const val ACTION_TOGGLE = "com.example.sawti.TOGGLE"
                  const val ACTION_STOP = "com.example.sawti.STOP"
                  const val ACTION_NEXT = "com.example.sawti.NEXT"
                  const val ACTION_PREVIOUS = "com.example.sawti.PREVIOUS"
                  const val ACTION_SEEK = "com.example.sawti.SEEK"
                  const val ACTION_SPEED = "com.example.sawti.SPEED"
                  const val ACTION_REMOVE = "com.example.sawti.REMOVE"
                  const val ACTION_MOVE = "com.example.sawti.MOVE"
                  const val ACTION_REPLACE_LIST = "com.example.sawti.REPLACE_LIST"
                  const val BROADCAST_STATE = "com.example.sawti.STATE"
                  const val EXTRA_URI = "uri"
                  const val EXTRA_INDEX = "index"
                  const val EXTRA_POSITION = "position"
                  const val EXTRA_SPEED = "speed"
                  const val EXTRA_URIS = "uris"
                  const val EXTRA_FROM = "from"
                  const val EXTRA_TO = "to"
                  private const val CHANNEL_ID = "sawti_playback"
                  private const val NOTIFICATION_ID = 42
              }

              private var player: MediaPlayer? = null
              private val playlist = ArrayList<String>()
              private var currentIndex = -1
              private var speed = 1.0f
              private val handler = Handler(Looper.getMainLooper())
              private val prefs by lazy { getSharedPreferences("sawti", MODE_PRIVATE) }
              private val ticker = object : Runnable {
                  override fun run() {
                      broadcastState()
                      if (player != null) handler.postDelayed(this, 500)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
                  loadPlaylist()
                  startForeground(NOTIFICATION_ID, notification())
                  handler.post(ticker)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_ADD -> intent.getStringExtra(EXTRA_URI)?.let { addUri(it) }
                      ACTION_PLAY_INDEX -> playIndex(intent.getIntExtra(EXTRA_INDEX, 0))
                      ACTION_TOGGLE -> toggle()
                      ACTION_STOP -> stopPlayback()
                      ACTION_NEXT -> if (playlist.isNotEmpty()) playIndex((currentIndex + 1).mod(playlist.size))
                      ACTION_PREVIOUS -> if (playlist.isNotEmpty()) playIndex(if (currentIndex <= 0) playlist.lastIndex else currentIndex - 1)
                      ACTION_SEEK -> {
                          val duration = player?.duration ?: 0
                          val requested = intent.getIntExtra(EXTRA_POSITION, 0).coerceIn(0, duration)
                          try { player?.seekTo(requested) } catch (_: IllegalStateException) { }
                          broadcastState()
                      }
                      ACTION_SPEED -> {
                          speed = intent.getFloatExtra(EXTRA_SPEED, 1.0f).coerceIn(0.5f, 2.0f)
                          applySpeed()
                          broadcastState()
                      }
                      ACTION_REMOVE -> removeAt(intent.getIntExtra(EXTRA_INDEX, -1))
                      ACTION_MOVE -> moveItem(intent.getIntExtra(EXTRA_FROM, -1), intent.getIntExtra(EXTRA_TO, -1))
                      ACTION_REPLACE_LIST -> {
                          val values = intent.getStringArrayListExtra(EXTRA_URIS)
                          if (values != null) { playlist.clear(); playlist.addAll(values); persistPlaylist(); broadcastState() }
                      }
                  }
                  updateNotification()
                  return START_STICKY
              }

              private fun loadPlaylist() {
                  val json = prefs.getString("playlist", "[]") ?: "[]"
                  try {
                      val array = JSONArray(json)
                      for (i in 0 until array.length()) playlist.add(array.getString(i))
                  } catch (_: Exception) { playlist.clear() }
                  currentIndex = prefs.getInt("index", -1).coerceIn(-1, maxOf(-1, playlist.lastIndex))
                  speed = prefs.getFloat("speed", 1.0f).coerceIn(0.5f, 2.0f)
              }

              private fun persistPlaylist() {
                  val array = JSONArray()
                  playlist.forEach { array.put(it) }
                  prefs.edit().putString("playlist", array.toString()).putInt("index", currentIndex).putFloat("speed", speed).apply()
              }

              private fun addUri(value: String) {
                  if (!playlist.contains(value)) playlist.add(value)
                  persistPlaylist()
                  if (currentIndex < 0 && playlist.isNotEmpty()) playIndex(0) else broadcastState()
              }

              private fun removeAt(index: Int) {
                  if (index !in playlist.indices) return
                  val wasCurrent = index == currentIndex
                  playlist.removeAt(index)
                  if (playlist.isEmpty()) { currentIndex = -1; releasePlayer() }
                  else if (index < currentIndex) currentIndex--
                  else if (wasCurrent) { currentIndex = -1; playIndex(index.coerceAtMost(playlist.lastIndex)) }
                  persistPlaylist(); broadcastState()
              }

              private fun moveItem(from: Int, to: Int) {
                  if (from !in playlist.indices || to !in playlist.indices || from == to) return
                  val item = playlist.removeAt(from)
                  playlist.add(to, item)
                  if (currentIndex == from) currentIndex = to
                  else if (from < currentIndex && to >= currentIndex) currentIndex--
                  else if (from > currentIndex && to <= currentIndex) currentIndex++
                  persistPlaylist(); broadcastState()
              }

              private fun playIndex(index: Int) {
                  if (index !in playlist.indices) return
                  currentIndex = index
                  releasePlayer()
                  val next = MediaPlayer()
                  player = next
                  try {
                      next.setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_MEDIA).setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                      next.setDataSource(this, Uri.parse(playlist[index]))
                      next.setOnPreparedListener { mp ->
                          applySpeedTo(mp)
                          mp.start()
                          updateNotification()
                          broadcastState()
                      }
                      next.setOnCompletionListener {
                          if (playlist.isNotEmpty()) playIndex((currentIndex + 1).mod(playlist.size)) else stopPlayback()
                      }
                      next.setOnErrorListener { _, _, _ -> broadcastState(); true }
                      next.prepareAsync()
                      persistPlaylist(); broadcastState()
                  } catch (e: IOException) {
                      releasePlayer()
                      Toast.makeText(this, "تعذّر فتح الملف الصوتي", Toast.LENGTH_SHORT).show()
                      broadcastState()
                  } catch (e: SecurityException) {
                      releasePlayer(); broadcastState()
                  } catch (e: IllegalArgumentException) {
                      releasePlayer(); broadcastState()
                  }
              }

              private fun toggle() {
                  val mp = player
                  if (mp == null) {
                      if (playlist.isNotEmpty()) playIndex(currentIndex.coerceAtLeast(0))
                      return
                  }
                  try {
                      if (mp.isPlaying) mp.pause() else if (mp.duration > 0) mp.start()
                      applySpeed()
                  } catch (_: IllegalStateException) { }
                  updateNotification(); broadcastState()
              }

              private fun stopPlayback() {
                  try { player?.stop() } catch (_: Exception) { }
                  releasePlayer()
                  updateNotification(); broadcastState()
              }

              private fun releasePlayer() {
                  try { player?.release() } catch (_: Exception) { }
                  player = null
              }

              private fun applySpeed() {
                  player?.let { applySpeedTo(it) }
                  prefs.edit().putFloat("speed", speed).apply()
              }

              private fun applySpeedTo(mp: MediaPlayer) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      try { mp.playbackParams = mp.playbackParams.setSpeed(speed) } catch (_: Exception) { }
                  }
              }

              private fun broadcastState() {
                  val mp = player
                  val intent = Intent(BROADCAST_STATE).setPackage(packageName)
                      .putStringArrayListExtra(EXTRA_URIS, ArrayList(playlist))
                      .putExtra(EXTRA_INDEX, currentIndex)
                      .putExtra(EXTRA_POSITION, try { mp?.currentPosition ?: 0 } catch (_: Exception) { 0 })
                      .putExtra("duration", try { mp?.duration ?: 0 } catch (_: Exception) { 0 })
                      .putExtra("playing", try { mp?.isPlaying ?: false } catch (_: Exception) { false })
                      .putExtra(EXTRA_SPEED, speed)
                  sendBroadcast(intent)
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(CHANNEL_ID, "تشغيل الصوت", NotificationManager.IMPORTANCE_LOW)
                      channel.description = "إشعار تشغيل الصوت في الخلفية"
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun notification(): Notification {
                  val openIntent = PendingIntent.getActivity(this, 1, Intent(this, MainActivity::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, CHANNEL_ID) else Notification.Builder(this)
                  return builder.setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle("صوتي - مشغّل الصوت")
                      .setContentText(currentTitle())
                      .setContentIntent(openIntent)
                      .setOngoing(player != null)
                      .addAction(Notification.Action.Builder(android.graphics.drawable.Icon.createWithResource(this, android.R.drawable.ic_media_previous), "السابق", servicePending(ACTION_PREVIOUS, 2)).build())
                      .addAction(Notification.Action.Builder(android.graphics.drawable.Icon.createWithResource(this, if (isPlaying()) android.R.drawable.ic_media_pause else android.R.drawable.ic_media_play), if (isPlaying()) "إيقاف مؤقت" else "تشغيل", servicePending(ACTION_TOGGLE, 3)).build())
                      .addAction(Notification.Action.Builder(android.graphics.drawable.Icon.createWithResource(this, android.R.drawable.ic_media_next), "التالي", servicePending(ACTION_NEXT, 4)).build())
                      .build()
              }

              private fun servicePending(action: String, request: Int): PendingIntent {
                  val intent = Intent(this, PlaybackService::class.java).setAction(action)
                  return PendingIntent.getService(this, request, intent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              }

              private fun currentTitle(): String = if (currentIndex in playlist.indices) Uri.parse(playlist[currentIndex]).lastPathSegment ?: "ملف صوتي" else "اختر ملفًا صوتيًا"
              private fun isPlaying(): Boolean = try { player?.isPlaying == true } catch (_: Exception) { false }
              private fun updateNotification() {
                  try { getSystemService(NotificationManager::class.java).notify(NOTIFICATION_ID, notification()) } catch (_: Exception) { }
              }

              override fun onDestroy() {
                  handler.removeCallbacks(ticker)
                  releasePlayer()
                  super.onDestroy()
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat > app/src/main/java/com/example/sawti/FloatingWidgetService.kt <<'EOF'
          package com.example.sawti

          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.LinearLayout
          import android.widget.TextView

          class FloatingWidgetService : Service() {
              private lateinit var wm: WindowManager
              private var bubble: TextView? = null
              private var panel: LinearLayout? = null
              private var bubbleParams: WindowManager.LayoutParams? = null
              private var panelParams: WindowManager.LayoutParams? = null
              private var downX = 0f
              private var downY = 0f
              private var startX = 0
              private var startY = 0
              private var longPress = false
              private val handler = android.os.Handler(android.os.Looper.getMainLooper())

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  createBubble()
              }

              private fun overlayType(): Int = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE
              private fun params(width: Int, height: Int, gravity: Int = Gravity.TOP or Gravity.START) = WindowManager.LayoutParams(width, height, overlayType(), WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN, PixelFormat.TRANSLUCENT).apply { this.gravity = gravity; x = 24; y = 180 }

              private fun createBubble() {
                  val view = TextView(this).apply {
                      text = "♫"
                      textSize = 27f
                      gravity = Gravity.CENTER
                      setTextColor(Color.WHITE)
                      typeface = Typeface.DEFAULT_BOLD
                      background = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(Color.rgb(108,99,255), Color.rgb(0,188,212))).apply { shape = GradientDrawable.OVAL; setStroke(3, Color.WHITE) }
                      elevation = 12f
                  }
                  val lp = params(62, 62)
                  bubble = view; bubbleParams = lp
                  view.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = event.rawX; downY = event.rawY
                              startX = lp.x; startY = lp.y; longPress = false
                              handler.postDelayed({ longPress = true; showPanel() }, 550)
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (event.rawX - downX).toInt(); val dy = (event.rawY - downY).toInt()
                              if (kotlin.math.abs(dx) > 8 || kotlin.math.abs(dy) > 8) handler.removeCallbacksAndMessages(null)
                              lp.x = (startX + dx).coerceAtLeast(0); lp.y = (startY + dy).coerceAtLeast(0)
                              try { wm.updateViewLayout(view, lp) } catch (_: Exception) { }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              handler.removeCallbacksAndMessages(null)
                              if (!longPress && kotlin.math.abs(event.rawX - downX) < 12 && kotlin.math.abs(event.rawY - downY) < 12) command(PlaybackService.ACTION_TOGGLE)
                              true
                          }
                          MotionEvent.ACTION_CANCEL -> { handler.removeCallbacksAndMessages(null); true }
                          else -> true
                      }
                  }
                  try { wm.addView(view, lp) } catch (_: Exception) { stopSelf() }
              }

              private fun showPanel() {
                  if (panel != null) { hidePanel(); return }
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(14, 12, 14, 12)
                      background = GradientDrawable().apply { setColor(Color.rgb(24, 29, 52)); cornerRadius = 24f; setStroke(2, Color.rgb(108,99,255)) }
                      elevation = 16f
                  }
                  val title = TextView(this).apply { text = "مشغّل صوتي"; textSize = 16f; setTextColor(Color.WHITE); gravity = Gravity.CENTER; setPadding(8, 6, 8, 12) }
                  box.addView(title)
                  val row = LinearLayout(this).apply { gravity = Gravity.CENTER; orientation = LinearLayout.HORIZONTAL }
                  addButton(row, "|◀") { command(PlaybackService.ACTION_PREVIOUS) }
                  addButton(row, "▶ / ❚❚") { command(PlaybackService.ACTION_TOGGLE) }
                  addButton(row, "▶|") { command(PlaybackService.ACTION_NEXT) }
                  box.addView(row)
                  val close = TextView(this).apply { text = "إخفاء اللوحة"; gravity = Gravity.CENTER; setTextColor(Color.LTGRAY); setPadding(8, 12, 8, 4); setOnClickListener { hidePanel() } }
                  box.addView(close)
                  val lp = params(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT).apply { x = bubbleParams?.x ?: 24; y = (bubbleParams?.y ?: 180) + 72 }
                  panel = box; panelParams = lp
                  try { wm.addView(box, lp) } catch (_: Exception) { panel = null }
              }

              private fun addButton(row: LinearLayout, label: String, action: () -> Unit) {
                  val b = TextView(this).apply {
                      text = label; textSize = 16f; gravity = Gravity.CENTER; setTextColor(Color.WHITE); setPadding(12, 12, 12, 12)
                      background = GradientDrawable().apply { setColor(Color.rgb(108,99,255)); cornerRadius = 16f }
                      setOnClickListener { action() }
                  }
                  val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                  lp.setMargins(4, 2, 4, 2); row.addView(b, lp)
              }

              private fun command(action: String) {
                  val intent = Intent(this, PlaybackService::class.java).setAction(action)
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(intent) else startService(intent)
              }
              private fun hidePanel() { panel?.let { try { wm.removeView(it) } catch (_: Exception) { } }; panel = null; panelParams = null }
              override fun onDestroy() { hidePanel(); bubble?.let { try { wm.removeView(it) } catch (_: Exception) { } }; bubble = null; super.onDestroy() }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          cat > app/src/main/java/com/example/sawti/CircularSeekView.kt <<'EOF'
          package com.example.sawti

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.RectF
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.atan2
          import kotlin.math.min

          class CircularSeekView(context: Context) : View(context) {
              var durationMs: Int = 0
                  private set
              var positionMs: Int = 0
                  private set
              var onSeek: ((Int) -> Unit)? = null
              var onSeekFinished: ((Int) -> Unit)? = null
              private val track = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xFF444B78.toInt(); style = Paint.Style.STROKE; strokeWidth = 13f; strokeCap = Paint.Cap.ROUND }
              private val progress = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xFF00D2BE.toInt(); style = Paint.Style.STROKE; strokeWidth = 13f; strokeCap = Paint.Cap.ROUND }
              private val knob = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xFFFFFFFF.toInt(); style = Paint.Style.FILL }
              private val timePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xFFFFFFFF.toInt(); textAlign = Paint.Align.CENTER; textSize = 20f; typeface = android.graphics.Typeface.DEFAULT_BOLD }
              private val hintPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = 0xFFB9BEDB.toInt(); textAlign = Paint.Align.CENTER; textSize = 12f }
              private var dragging = false

              fun setPlaybackPosition(position: Int, duration: Int) {
                  durationMs = duration.coerceAtLeast(0)
                  positionMs = position.coerceIn(0, durationMs)
                  invalidate()
              }

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val desired = (190 * resources.displayMetrics.density).toInt()
                  val w = resolveSize(desired, widthMeasureSpec)
                  val h = resolveSize(desired, heightMeasureSpec)
                  val size = min(w, h)
                  setMeasuredDimension(size, size)
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val cx = width / 2f; val cy = height / 2f
                  val radius = min(width, height) * 0.39f
                  val rect = RectF(cx - radius, cy - radius, cx + radius, cy + radius)
                  canvas.drawArc(rect, -90f, 360f, false, track)
                  val sweep = if (durationMs > 0) 360f * positionMs / durationMs else 0f
                  canvas.drawArc(rect, -90f, sweep, false, progress)
                  val angle = Math.toRadians((sweep - 90f).toDouble())
                  canvas.drawCircle(cx + radius * kotlin.math.cos(angle).toFloat(), cy + radius * kotlin.math.sin(angle).toFloat(), 8f, knob)
                  canvas.drawText(format(positionMs), cx, cy - 2f, timePaint)
                  canvas.drawText("من ${format(durationMs)}", cx, cy + 23f, hintPaint)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.action) {
                      MotionEvent.ACTION_DOWN -> { dragging = true; parent?.requestDisallowInterceptTouchEvent(true); updateFromTouch(event.x, event.y); return true }
                      MotionEvent.ACTION_MOVE -> { if (dragging) updateFromTouch(event.x, event.y); return true }
                      MotionEvent.ACTION_UP -> { if (dragging) updateFromTouch(event.x, event.y); dragging = false; onSeekFinished?.invoke(positionMs); performClick(); return true }
                      MotionEvent.ACTION_CANCEL -> { dragging = false; return true }
                  }
                  return true
              }

              override fun performClick(): Boolean { super.performClick(); return true }

              private fun updateFromTouch(x: Float, y: Float) {
                  if (durationMs <= 0) return
                  val dx = x - width / 2f; val dy = y - height / 2f
                  var degrees = Math.toDegrees(atan2(dy.toDouble(), dx.toDouble())).toFloat() + 90f
                  if (degrees < 0f) degrees += 360f
                  positionMs = (durationMs * (degrees / 360f)).toInt().coerceIn(0, durationMs)
                  invalidate()
                  onSeek?.invoke(positionMs)
              }

              private fun format(ms: Int): String {
                  val seconds = ms.coerceAtLeast(0) / 1000
                  return String.format(java.util.Locale.US, "%02d:%02d", seconds / 60, seconds % 60)
              }
          }
          EOF

          cat > app/src/main/java/com/example/sawti/MainActivity.kt <<'EOF'
          package com.example.sawti

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*

          class MainActivity : Activity() {
              private val uris = ArrayList<String>()
              private val names = ArrayList<String>()
              private lateinit var listBox: LinearLayout
              private lateinit var titleView: TextView
              private lateinit var stateView: TextView
              private lateinit var timeView: TextView
              private lateinit var circularSeek: CircularSeekView
              private lateinit var playButton: TextView
              private lateinit var speedButton: TextView
              private var currentIndex = -1
              private var duration = 0
              private var currentPosition = 0
              private var playing = false
              private var speed = 1f
              private var userSeeking = false
              private var receiverRegistered = false

              private val stateReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action != PlaybackService.BROADCAST_STATE) return
                      val incoming = intent.getStringArrayListExtra(PlaybackService.EXTRA_URIS) ?: arrayListOf()
                      if (incoming != uris) {
                          uris.clear(); uris.addAll(incoming)
                          names.clear(); uris.forEach { names.add(displayName(Uri.parse(it))) }
                          renderPlaylist()
                      }
                      val previousIndex = currentIndex
                      currentIndex = intent.getIntExtra(PlaybackService.EXTRA_INDEX, -1)
                      if (previousIndex != currentIndex) renderPlaylist()
                      currentPosition = intent.getIntExtra(PlaybackService.EXTRA_POSITION, 0)
                      duration = intent.getIntExtra("duration", 0)
                      playing = intent.getBooleanExtra("playing", false)
                      speed = intent.getFloatExtra(PlaybackService.EXTRA_SPEED, 1f)
                      updatePlayerUi()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(16, 20, 38)
                  window.navigationBarColor = Color.rgb(16, 20, 38)
                  buildUi()
                  registerStateReceiver()
                  startPlaybackService()
                  requestNotificationPermission()
              }

              private fun buildUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 18, 20, 18)
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                      background = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(Color.rgb(16,20,38), Color.rgb(34,39,75), Color.rgb(20,25,48)))
                  }
                  val top = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  val heading = TextView(this).apply { text = "صوتي"; textSize = 27f; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD }
                  top.addView(heading, LinearLayout.LayoutParams(0, -2, 1f))
                  speedButton = button("السرعة 1.0×", 14).apply { setOnClickListener { showSpeedMenu(it) } }
                  top.addView(speedButton)
                  root.addView(top)
                  root.addView(label("مشغّل صوتك، في كل مكان", 14, Color.LTGRAY).apply { setPadding(0, 3, 0, 16) })

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setPadding(18, 22, 18, 20)
                      background = GradientDrawable().apply { setColor(Color.argb(220, 34, 41, 76)); cornerRadius = 28f; setStroke(1, Color.rgb(94, 101, 170)) }
                  }
                  titleView = label("لم تختر ملفًا صوتيًا بعد", 19, Color.WHITE).apply { typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER; maxLines = 2 }
                  card.addView(titleView, LinearLayout.LayoutParams(-1, -2))
                  stateView = label("جاهز للتشغيل", 13, Color.LTGRAY).apply { gravity = Gravity.CENTER; setPadding(0, 8, 0, 14) }
                  card.addView(stateView)
                  circularSeek = CircularSeekView(this).apply {
                      onSeek = { requestedPosition ->
                          userSeeking = true
                          timeView.text = "${formatTime(requestedPosition)} / ${formatTime(duration)}"
                      }
                      onSeekFinished = { requestedPosition ->
                          userSeeking = false
                          if (duration > 0) command(PlaybackService.ACTION_SEEK) { putExtra(PlaybackService.EXTRA_POSITION, requestedPosition) }
                      }
                  }
                  card.addView(circularSeek, LinearLayout.LayoutParams(190.dp(), 190.dp()).apply { gravity = Gravity.CENTER })
                  timeView = label("00:00 / 00:00", 12, Color.LTGRAY).apply { gravity = Gravity.CENTER; setPadding(0, 2, 0, 12) }
                  card.addView(timeView)
                  val controls = LinearLayout(this).apply { gravity = Gravity.CENTER; orientation = LinearLayout.HORIZONTAL }
                  controls.addView(button("السابق", 13).apply { setOnClickListener { command(PlaybackService.ACTION_PREVIOUS) } })
                  playButton = button("▶ تشغيل", 16).apply { setOnClickListener { command(PlaybackService.ACTION_TOGGLE) } }
                  controls.addView(playButton, LinearLayout.LayoutParams(0, 52, 1f))
                  controls.addView(button("التالي", 13).apply { setOnClickListener { command(PlaybackService.ACTION_NEXT) } })
                  card.addView(controls)
                  val secondary = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER; setPadding(0, 14, 0, 0) }
                  secondary.addView(button("إيقاف نهائي", 12).apply { setOnClickListener { command(PlaybackService.ACTION_STOP) } })
                  secondary.addView(button("الفقاعة العائمة", 12).apply { setOnClickListener { enableFloating() } })
                  card.addView(secondary)
                  root.addView(card)

                  val listHeader = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(0, 20, 0, 10) }
                  listHeader.addView(label("قائمة التشغيل", 20, Color.WHITE).apply { typeface = Typeface.DEFAULT_BOLD }, LinearLayout.LayoutParams(0, -2, 1f))
                  listHeader.addView(button("＋ إضافة ملفات", 13).apply { setOnClickListener { chooseAudio() } })
                  root.addView(listHeader)
                  val scroll = ScrollView(this)
                  listBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  scroll.addView(listBox)
                  root.addView(scroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  setContentView(root)
                  renderPlaylist()
              }

              private fun label(text: String, size: Int, color: Int) = TextView(this).apply { this.text = text; textSize = size.toFloat(); setTextColor(color) }
              private fun button(text: String, size: Int) = TextView(this).apply {
                  this.text = text; textSize = size.toFloat(); setTextColor(Color.WHITE); gravity = Gravity.CENTER; setPadding(13, 10, 13, 10)
                  background = GradientDrawable().apply { setColor(if (text.contains("تشغيل") || text.contains("إضافة")) Color.rgb(108,99,255) else Color.rgb(53,61,105)); cornerRadius = 17f }
                  val lp = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT); lp.setMargins(4, 3, 4, 3); layoutParams = lp
              }

              private fun chooseAudio() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE); type = "audio/*"; putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                  }
                  startActivityForResult(intent, 100)
              }

              @Deprecated("Deprecated by Android API; retained for broad device compatibility")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode != 100 || resultCode != RESULT_OK || data == null) return
                  val selected = ArrayList<Uri>()
                  data.clipData?.let { clip -> for (i in 0 until clip.itemCount) selected.add(clip.getItemAt(i).uri) }
                      ?: data.data?.let { selected.add(it) }
                  selected.forEach { uri ->
                      try { contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) { }
                      if (!uris.contains(uri.toString())) {
                          uris.add(uri.toString()); names.add(displayName(uri))
                          command(PlaybackService.ACTION_ADD) { putExtra(PlaybackService.EXTRA_URI, uri.toString()) }
                      }
                  }
                  renderPlaylist()
              }

              private fun displayName(uri: Uri): String {
                  var result = uri.lastPathSegment ?: "ملف صوتي"
                  try { contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { if (it.moveToFirst()) result = it.getString(0) ?: result } } catch (_: Exception) { }
                  return result.substringAfterLast('/')
              }

              private fun renderPlaylist() {
                  if (!::listBox.isInitialized) return
                  listBox.removeAllViews()
                  if (uris.isEmpty()) {
                      listBox.addView(label("أضف ملفات صوتية من جهازك لتظهر هنا.", 14, Color.LTGRAY).apply { gravity = Gravity.CENTER; setPadding(8, 28, 8, 28) })
                      return
                  }
                  uris.forEachIndexed { index, uri ->
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(10, 8, 10, 8)
                          background = GradientDrawable().apply { setColor(if (index == currentIndex) Color.rgb(58,62,111) else Color.argb(180,35,41,72)); cornerRadius = 18f }
                      }
                      val info = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(4, 2, 4, 2) }
                      info.addView(label(if (index == currentIndex) "♫  ${names.getOrNull(index) ?: "ملف صوتي"}" else (names.getOrNull(index) ?: "ملف صوتي"), 14, Color.WHITE).apply { maxLines = 2 })
                      info.addView(label(if (index == currentIndex) "المسار الحالي" else "اضغط للتشغيل", 11, Color.LTGRAY))
                      info.setOnClickListener { command(PlaybackService.ACTION_PLAY_INDEX) { putExtra(PlaybackService.EXTRA_INDEX, index) } }
                      row.addView(info, LinearLayout.LayoutParams(0, -2, 1f))
                      row.addView(smallButton("↑") { if (index > 0) command(PlaybackService.ACTION_MOVE) { putExtra(PlaybackService.EXTRA_FROM, index); putExtra(PlaybackService.EXTRA_TO, index - 1) } })
                      row.addView(smallButton("↓") { if (index < uris.lastIndex) command(PlaybackService.ACTION_MOVE) { putExtra(PlaybackService.EXTRA_FROM, index); putExtra(PlaybackService.EXTRA_TO, index + 1) } })
                      row.addView(smallButton("×") { command(PlaybackService.ACTION_REMOVE) { putExtra(PlaybackService.EXTRA_INDEX, index) } })
                      val lp = LinearLayout.LayoutParams(-1, -2); lp.setMargins(0, 4, 0, 4); listBox.addView(row, lp)
                  }
              }

              private fun smallButton(text: String, action: () -> Unit) = TextView(this).apply {
                  this.text = text; textSize = 18f; gravity = Gravity.CENTER; setTextColor(Color.WHITE); setPadding(9, 7, 9, 7)
                  background = GradientDrawable().apply { setColor(Color.rgb(75,82,135)); cornerRadius = 12f }
                  setOnClickListener { action() }
              }

              private fun showSpeedMenu(anchor: View) {
                  val speeds = arrayOf("0.5×", "0.75×", "1.0×", "1.25×", "1.5×", "1.75×", "2.0×")
                  val values = floatArrayOf(0.5f, 0.75f, 1f, 1.25f, 1.5f, 1.75f, 2f)
                  AlertDialog.Builder(this).setTitle("سرعة التشغيل").setItems(speeds) { _, which ->
                      speed = values[which]
                      command(PlaybackService.ACTION_SPEED) { putExtra(PlaybackService.EXTRA_SPEED, speed) }
                      speedButton.text = "السرعة ${speed}×"
                  }.setNegativeButton("إلغاء", null).show()
              }

              private fun enableFloating() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      Toast.makeText(this, "فعّل السماح بالظهور فوق التطبيقات ثم ارجع واضغط الزر مرة أخرى", Toast.LENGTH_LONG).show()
                      return
                  }
                  try { startService(Intent(this, FloatingWidgetService::class.java)); Toast.makeText(this, "تم تشغيل الفقاعة العائمة", Toast.LENGTH_SHORT).show() }
                  catch (_: Exception) { Toast.makeText(this, "تعذّر تشغيل الفقاعة", Toast.LENGTH_SHORT).show() }
              }

              private fun command(action: String, extras: Intent.() -> Unit = {}) {
                  val intent = Intent(this, PlaybackService::class.java).setAction(action)
                  try { extras(intent) } catch (_: Exception) { }
                  startPlaybackService(intent)
              }

              private fun startPlaybackService(intent: Intent = Intent(this, PlaybackService::class.java)) {
                  try { if (Build.VERSION.SDK_INT >= 26) startForegroundService(intent) else startService(intent) }
                  catch (_: Exception) { Toast.makeText(this, "تعذّر بدء خدمة الصوت", Toast.LENGTH_SHORT).show() }
              }

              private fun registerStateReceiver() {
                  val filter = IntentFilter(PlaybackService.BROADCAST_STATE)
                  if (Build.VERSION.SDK_INT >= 33) registerReceiver(stateReceiver, filter, RECEIVER_NOT_EXPORTED) else registerReceiver(stateReceiver, filter)
                  receiverRegistered = true
              }

              private fun updatePlayerUi() {
                  if (!::titleView.isInitialized) return
                  titleView.text = names.getOrNull(currentIndex) ?: "لم تختر ملفًا صوتيًا بعد"
                  stateView.text = when { playing -> "قيد التشغيل"; currentIndex >= 0 -> "متوقف مؤقتًا أو جاهز"; else -> "جاهز للتشغيل" }
                  playButton.text = if (playing) "❚❚ إيقاف مؤقت" else "▶ تشغيل"
                  speedButton.text = "السرعة ${speed}×"
                  if (!userSeeking) circularSeek.setPlaybackPosition(currentPosition, duration)
                  timeView.text = "${formatTime(currentPosition)} / ${formatTime(duration)}"
              }

              private fun Int.dp(): Int = (this * resources.displayMetrics.density).toInt()

              private fun formatTime(ms: Int): String {
                  val seconds = (ms.coerceAtLeast(0) / 1000)
                  return String.format(java.util.Locale.US, "%02d:%02d", seconds / 60, seconds % 60)
              }

              private fun requestNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 501)
              }

              override fun onDestroy() {
                  if (receiverRegistered) try { unregisterReceiver(stateReceiver) } catch (_: Exception) { }
                  super.onDestroy()
              }
          }
          EOF

      - name: Validate generated project files
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/example/sawti/MainActivity.kt
          test -s app/src/main/java/com/example/sawti/PlaybackService.kt
          test -s app/src/main/java/com/example/sawti/FloatingWidgetService.kt
          echo "Project source files generated. Starting Gradle build."

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sawti-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
