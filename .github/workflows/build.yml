name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p proj/app/src/main/java/com/floatplayer
          mkdir -p proj/app/src/main/assets
          mkdir -p proj/app/src/main/res/values
          mkdir -p proj/app/src/main/res/drawable
          cd proj

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'FloatPlayer'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.floatplayer'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.floatplayer'
                  minSdk 26
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="مشغّل الدراسة"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="false"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".PlayerService"
                      android:exported="false"
                      android:foregroundServiceType="mediaPlayback"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0E2233" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#4CC2E8" android:pathData="M54,17C34.1,17 18,33.1 18,53v17c0,7.2 5.8,13 13,13h4c4.4,0 8,-3.6 8,-8V60c0,-4.4 -3.6,-8 -8,-8h-5v1C30,37.6 40.7,27 54,27s24,10.6 24,26v-1h-5c-4.4,0 -8,3.6 -8,8v15c0,4.4 3.6,8 8,8h4c7.2,0 13,-5.8 13,-13V53C90,33.1 73.9,17 54,17z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M48,42v27.1c-2.1,-1.6 -4.9,-2.3 -7.8,-1.7 -5,1 -8.1,5.1 -7.1,9.2 1,4.1 5.8,6.5 10.8,5.5 4.2,-0.9 7.1,-3.9 7.3,-7.2V52l19,-4.2v16.3c-2.1,-1.6 -4.9,-2.3 -7.8,-1.7 -5,1 -8.1,5.1 -7.1,9.2 1,4.1 5.8,6.5 10.8,5.5 4.2,-0.9 7.1,-3.9 7.3,-7.2V35z"/>
          </vector>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#4CC2E8</item>
                  <item name="android:statusBarColor">#0E2233</item>
                  <item name="android:navigationBarColor">#0E2233</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/floatplayer/MainActivity.kt <<'EOF'
          package com.floatplayer

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : Activity() {
              private lateinit var web: WebView

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = Color.rgb(14, 34, 51)
                  window.navigationBarColor = Color.rgb(14, 34, 51)
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.webChromeClient = WebChromeClient()
                  web.setBackgroundColor(Color.rgb(14, 34, 51))
                  web.addJavascriptInterface(Bridge(), "Android")
                  setContentView(web)
                  web.loadUrl("file:///android_asset/index.html")
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  }
              }

              override fun onBackPressed() {
                  web.evaluateJavascript("goBack()") {
                      if (it == "true") finish()
                  }
              }

              private fun nameOf(u: Uri): String {
                  var n = "صوتية"
                  try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          if (c.moveToFirst()) {
                              val i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                              if (i >= 0) n = c.getString(i)
                          }
                      }
                  } catch (_: Exception) {}
                  return n.substringBeforeLast('.')
              }

              @Deprecated("Deprecated in Android")
              override fun onActivityResult(rc: Int, res: Int, d: Intent?) {
                  super.onActivityResult(rc, res, d)
                  if (rc == 7 && res == RESULT_OK && d != null) {
                      val uris = ArrayList<Uri>()
                      val cd = d.clipData
                      if (cd != null) {
                          for (i in 0 until cd.itemCount) uris.add(cd.getItemAt(i).uri)
                      } else if (d.data != null) uris.add(d.data!!)
                      val arr = JSONArray()
                      for (u in uris) {
                          try {
                              contentResolver.takePersistableUriPermission(
                                  u, Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {}
                          arr.put(JSONObject().put("uri", u.toString()).put("name", nameOf(u)))
                      }
                      web.evaluateJavascript("onPicked(" + arr.toString() + ")", null)
                  }
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun pick() {
                      runOnUiThread {
                          val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                          i.addCategory(Intent.CATEGORY_OPENABLE)
                          i.type = "audio/*"
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                          i.addFlags(
                              Intent.FLAG_GRANT_READ_URI_PERMISSION or
                              Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION
                          )
                          startActivityForResult(i, 7)
                      }
                  }

                  @JavascriptInterface
                  fun play(q: String, i: Int, p: Int) {
                      runOnUiThread {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "فعّل العرض فوق التطبيقات الأخرى ثم اضغط تشغيل مجددًا",
                                  Toast.LENGTH_LONG
                              ).show()
                              startActivity(
                                  Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:" + packageName)
                                  )
                              )
                          } else {
                              val s = Intent(this@MainActivity, PlayerService::class.java)
                              s.putExtra("queue", q)
                              s.putExtra("idx", i)
                              s.putExtra("pos", p)
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(s)
                              } else {
                                  startService(s)
                              }
                          }
                      }
                  }

                  @JavascriptInterface
                  fun state(): String = PlayerService.inst?.stateJson() ?: "{}"
              }
          }
          EOF

          cat > app/src/main/java/com/floatplayer/PlayerService.kt <<'EOF'
          package com.floatplayer

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.RectF
          import android.graphics.Typeface
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject

          fun fmt(ms: Int): String {
              val s = ms.coerceAtLeast(0) / 1000
              return "%d:%02d".format(s / 60, s % 60)
          }

          class PlayerService : Service() {
              companion object { var inst: PlayerService? = null }

              lateinit var wm: WindowManager
              private var mp: MediaPlayer? = null
              private var ready = false
              private var queue = JSONArray()
              private var idx = 0
              var curUri = ""
              var curName = ""
              var markA = -1
              var markB = -1
              var loopA = -1
              var loopB = -1
              private var bubble: BubbleView? = null
              private val h = Handler(Looper.getMainLooper())

              private val tick = object : Runnable {
                  override fun run() {
                      try {
                          val m = mp
                          if (ready && m != null && m.isPlaying &&
                              loopA >= 0 && loopB > loopA &&
                              m.currentPosition >= loopB) {
                              m.seekTo(loopA)
                          }
                          bubble?.invalidate()
                      } catch (_: Exception) {}
                      h.postDelayed(this, 100)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  inst = this
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("pl", "المشغّل", NotificationManager.IMPORTANCE_LOW)
                  )
                  h.post(tick)
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  try { mp?.release() } catch (_: Exception) {}
                  mp = null
                  inst = null
                  super.onDestroy()
              }

              private fun notif(title: String): Notification =
                  Notification.Builder(this, "pl")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentTitle(title)
                      .setContentText("المشغّل العائم يعمل")
                      .setOngoing(true)
                      .build()

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForeground(1, notif(if (curName.isEmpty()) "المشغّل" else curName))
                  if (intent != null && intent.hasExtra("queue")) {
                      queue = JSONArray(intent.getStringExtra("queue"))
                      playAt(intent.getIntExtra("idx", 0), intent.getIntExtra("pos", 0))
                  }
                  return START_NOT_STICKY
              }

              private fun playAt(i: Int, startPos: Int) {
                  if (i < 0 || i >= queue.length()) return
                  val item = queue.getJSONObject(i)
                  idx = i
                  curUri = item.getString("uri")
                  curName = item.getString("name")
                  cancelAB(false)
                  ready = false
                  try { mp?.release() } catch (_: Exception) {}
                  val player = MediaPlayer()
                  mp = player
                  try {
                      player.setDataSource(this, Uri.parse(curUri))
                      player.setOnPreparedListener {
                          ready = true
                          if (startPos > 0) it.seekTo(startPos.coerceAtMost(it.duration))
                          it.start()
                          bubble?.invalidate()
                      }
                      player.setOnCompletionListener {
                          if (idx + 1 < queue.length()) playAt(idx + 1, 0)
                      }
                      player.setOnErrorListener { _, _, _ ->
                          ready = false
                          true
                      }
                      player.prepareAsync()
                  } catch (_: Exception) {
                      ready = false
                      Toast.makeText(this, "تعذّر تشغيل الملف", Toast.LENGTH_SHORT).show()
                  }
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(1, notif(curName))
                  ensureBubble()
              }

              fun pos(): Int = try { if (ready) mp?.currentPosition ?: 0 else 0 } catch (_: Exception) { 0 }
              fun dur(): Int = try { if (ready) mp?.duration ?: 0 else 0 } catch (_: Exception) { 0 }
              fun playing(): Boolean = try { ready && (mp?.isPlaying ?: false) } catch (_: Exception) { false }

              fun toggle() {
                  if (!ready) return
                  try {
                      val m = mp ?: return
                      if (m.isPlaying) m.pause() else m.start()
                  } catch (_: Exception) {}
                  bubble?.invalidate()
              }

              fun seekBy(ms: Int) = seekTo(pos() + ms)

              fun seekTo(ms: Int) {
                  if (!ready) return
                  try { mp?.seekTo(ms.coerceIn(0, dur())) } catch (_: Exception) {}
                  bubble?.invalidate()
              }

              fun setA() {
                  if (!ready) return
                  markA = pos()
                  markB = -1
                  loopA = -1
                  loopB = -1
                  Toast.makeText(this, "تم تحديد A عند ${fmt(markA)}", Toast.LENGTH_SHORT).show()
                  bubble?.invalidate()
              }

              fun setB() {
                  if (!ready) return
                  if (markA < 0) {
                      Toast.makeText(this, "حدّد A أولًا", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val b = pos()
                  if (b <= markA + 100) {
                      Toast.makeText(this, "يجب أن تكون B بعد A", Toast.LENGTH_SHORT).show()
                      return
                  }
                  markB = b
                  loopA = markA
                  loopB = markB
                  seekTo(loopA)
                  if (!playing()) {
                      try { mp?.start() } catch (_: Exception) {}
                  }
                  Toast.makeText(this, "بدأ التكرار بين A وB", Toast.LENGTH_SHORT).show()
                  bubble?.invalidate()
              }

              fun cancelAB(showMessage: Boolean = true) {
                  val active = loopA >= 0
                  loopA = -1
                  loopB = -1
                  markA = -1
                  markB = -1
                  if (showMessage && active) {
                      Toast.makeText(
                          this, "أُلغي A-B، يستمر التشغيل العادي", Toast.LENGTH_SHORT
                      ).show()
                  }
                  bubble?.invalidate()
              }

              fun stateJson(): String = try {
                  JSONObject()
                      .put("uri", curUri)
                      .put("playing", playing())
                      .put("pos", pos())
                      .put("dur", dur())
                      .put("loopA", loopA)
                      .put("loopB", loopB)
                      .toString()
              } catch (_: Exception) { "{}" }

              fun dp(x: Int): Int = (x * resources.displayMetrics.density).toInt()

              private fun ensureBubble() {
                  if (bubble != null) return
                  val v = BubbleView(this, this)
                  val p = WindowManager.LayoutParams(
                      dp(150), dp(150),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  p.gravity = Gravity.TOP or Gravity.START
                  p.x = resources.displayMetrics.widthPixels - dp(170)
                  p.y = dp(150)
                  v.lp = p
                  wm.addView(v, p)
                  bubble = v
              }

              fun closeAll() {
                  bubble?.let { try { wm.removeView(it) } catch (_: Exception) {} }
                  bubble = null
                  h.removeCallbacksAndMessages(null)
                  try { mp?.release() } catch (_: Exception) {}
                  mp = null
                  ready = false
                  curUri = ""
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }
          }

          class BubbleView(ctx: Context, private val svc: PlayerService) : View(ctx) {
              var lp: WindowManager.LayoutParams? = null
              private val d = ctx.resources.displayMetrics.density
              private val sz = 150f * d
              private val c = sz / 2f
              private val pt = Paint(Paint.ANTI_ALIAS_FLAG)
              private var downX = 0f
              private var downY = 0f
              private var sx = 0
              private var sy = 0
              private var zone = 0
              private var moved = false
              private var scrub = false
              private var scrubFrac = 0f

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(sz.toInt(), sz.toInt())
              }

              private fun mark(cv: Canvas, ms: Int, duration: Int, color: String) {
                  if (duration <= 0) return
                  val a = Math.toRadians(-90.0 + 360.0 * ms.toDouble() / duration)
                  pt.color = Color.parseColor(color)
                  cv.drawCircle(
                      c + 61 * d * Math.cos(a).toFloat(),
                      c + 61 * d * Math.sin(a).toFloat(),
                      5 * d, pt
                  )
              }

              private fun button(cv: Canvas, x: Float, y: Float, label: String, color: String) {
                  pt.style = Paint.Style.FILL
                  pt.color = Color.parseColor(color)
                  cv.drawRoundRect(
                      RectF(x - 15*d, y - 11*d, x + 15*d, y + 11*d),
                      7*d, 7*d, pt
                  )
                  pt.color = Color.WHITE
                  pt.textAlign = Paint.Align.CENTER
                  pt.typeface = Typeface.DEFAULT_BOLD
                  pt.textSize = 11*d
                  cv.drawText(label, x, y + 4*d, pt)
              }

              override fun onDraw(cv: Canvas) {
                  super.onDraw(cv)
                  val duration = svc.dur()
                  val real = if (duration > 0) svc.pos().toFloat() / duration else 0f
                  val frac = if (scrub) scrubFrac else real

                  pt.style = Paint.Style.STROKE
                  pt.strokeWidth = 4*d
                  pt.color = Color.parseColor("#3b5d78")
                  cv.drawCircle(c, c, 61*d, pt)

                  pt.strokeWidth = 3*d
                  pt.color = Color.parseColor("#7fb4d4")
                  cv.drawArc(
                      RectF(c-61*d, c-61*d, c+61*d, c+61*d),
                      -90f, 360f*frac, false, pt
                  )
                  pt.style = Paint.Style.FILL

                  if (duration > 0) {
                      if (svc.markA >= 0) mark(cv, svc.markA, duration, "#ff4fa3")
                      if (svc.markB >= 0) mark(cv, svc.markB, duration, "#ffd23f")
                  }

                  val angle = Math.toRadians(-90.0 + 360.0*frac)
                  pt.color = Color.WHITE
                  cv.drawCircle(
                      c + 61*d*Math.cos(angle).toFloat(),
                      c + 61*d*Math.sin(angle).toFloat(),
                      5*d, pt
                  )

                  pt.color = Color.parseColor("#1e6a8f")
                  cv.drawCircle(c, c, 44*d, pt)
                  pt.style = Paint.Style.STROKE
                  pt.strokeWidth = 3*d
                  pt.color = Color.parseColor("#4a9cc4")
                  cv.drawCircle(c, c, 44*d, pt)
                  pt.style = Paint.Style.FILL
                  pt.color = Color.parseColor("#e5473f")
                  cv.drawCircle(c, c, 21*d, pt)
                  pt.color = Color.WHITE

                  if (svc.playing()) {
                      cv.drawRect(c-7*d, c-9*d, c-2*d, c+9*d, pt)
                      cv.drawRect(c+3*d, c-9*d, c+8*d, c+9*d, pt)
                  } else {
                      val path = Path()
                      path.moveTo(c-5*d, c-10*d)
                      path.lineTo(c-5*d, c+10*d)
                      path.lineTo(c+11*d, c)
                      path.close()
                      cv.drawPath(path, pt)
                  }

                  pt.color = Color.WHITE
                  pt.textAlign = Paint.Align.CENTER
                  pt.typeface = Typeface.DEFAULT_BOLD
                  pt.textSize = 19*d
                  cv.drawText("«", c-32*d, c+3*d, pt)
                  cv.drawText("»", c+32*d, c+3*d, pt)
                  pt.textSize = 10*d
                  cv.drawText("15", c-32*d, c+17*d, pt)
                  cv.drawText("15", c+32*d, c+17*d, pt)

                  if (scrub && duration > 0) {
                      pt.textSize = 12*d
                      cv.drawText(fmt((scrubFrac*duration).toInt()), c, c-28*d, pt)
                  }

                  pt.color = Color.parseColor("#0e2233")
                  cv.drawCircle(sz-15*d, 15*d, 11*d, pt)
                  pt.color = Color.WHITE
                  pt.textSize = 13*d
                  cv.drawText("×", sz-15*d, 19*d, pt)

                  val by = sz - 20*d
                  button(cv, c-37*d, by, "A", if (svc.markA >= 0) "#d63384" else "#31516b")
                  button(cv, c, by, "B", if (svc.loopB >= 0) "#c58b00" else "#31516b")
                  button(cv, c+37*d, by, "×", if (svc.loopA >= 0) "#c0392b" else "#31516b")

                  if (svc.loopA >= 0 && svc.loopB > svc.loopA) {
                      pt.color = Color.parseColor("#ffd23f")
                      pt.textSize = 10*d
                      cv.drawText("A-B", c, c-29*d, pt)
                  }
              }

              private fun fracAt(x: Float, y: Float): Float {
                  var deg = Math.toDegrees(
                      Math.atan2((y-c).toDouble(), (x-c).toDouble())
                  ) + 90.0
                  if (deg < 0) deg += 360.0
                  return (deg/360.0).toFloat().coerceIn(0f, 1f)
              }

              private fun hit(x: Float, y: Float): Int {
                  fun dist(ax: Float, ay: Float): Float =
                      Math.hypot((x-ax).toDouble(), (y-ay).toDouble()).toFloat()

                  if (dist(sz-15*d, 15*d) < 17*d) return 4
                  val by = sz-20*d
                  if (dist(c-37*d, by) < 18*d) return 7
                  if (dist(c, by) < 18*d) return 8
                  if (dist(c+37*d, by) < 18*d) return 9
                  if (dist(c, c) < 24*d) return 1

                  if (y > c-28*d && y < c+28*d) {
                      if (x > c-45*d && x < c-22*d) return 2
                      if (x > c+22*d && x < c+45*d) return 3
                  }

                  val r = dist(c, c)
                  if (r > 47*d && r < 73*d && svc.dur() > 0) return 6
                  return 0
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          downX = e.rawX
                          downY = e.rawY
                          sx = lp?.x ?: 0
                          sy = lp?.y ?: 0
                          zone = hit(e.x, e.y)
                          moved = false
                          scrub = zone == 6
                          if (scrub) scrubFrac = fracAt(e.x, e.y)
                          invalidate()
                          return true
                      }

                      MotionEvent.ACTION_MOVE -> {
                          if (scrub) {
                              scrubFrac = fracAt(e.x, e.y)
                              invalidate()
                          } else {
                              val dx = e.rawX-downX
                              val dy = e.rawY-downY
                              if (!moved && Math.hypot(dx.toDouble(), dy.toDouble()) > 12*d) {
                                  moved = true
                              }
                              if (moved) {
                                  val p = lp
                                  if (p != null) {
                                      p.x = sx+dx.toInt()
                                      p.y = sy+dy.toInt()
                                      try { svc.wm.updateViewLayout(this, p) } catch (_: Exception) {}
                                  }
                              }
                          }
                      }

                      MotionEvent.ACTION_UP -> {
                          if (scrub) {
                              svc.seekTo((scrubFrac*svc.dur()).toInt())
                              scrub = false
                          } else if (!moved) {
                              when (zone) {
                                  1 -> svc.toggle()
                                  2 -> svc.seekBy(-15000)
                                  3 -> svc.seekBy(15000)
                                  4 -> svc.closeAll()
                                  7 -> svc.setA()
                                  8 -> svc.setB()
                                  9 -> svc.cancelAB()
                              }
                          }
                          invalidate()
                      }

                      MotionEvent.ACTION_CANCEL -> {
                          scrub = false
                          invalidate()
                      }
                  }
                  return true
              }
          }
          EOF

          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          :root{--bg:#0e2233;--card:#15324a;--tx:#eef6fb;--mu:#8fb0c7;--b:#4cc2e8;--c:#e5473f}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;padding:16px 14px 60px;background:var(--bg);color:var(--tx);font-family:sans-serif}
          h1{font-size:20px;margin:4px 0 12px;color:var(--b)}
          h3{margin:16px 4px 6px}
          .btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;margin:6px 0;font:inherit;font-weight:700;color:#fff;background:linear-gradient(135deg,#1f7aa6,var(--c))}
          .btn.s{background:var(--card);border:1px solid #4cc2e855}
          .card{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:12px 14px;margin:8px 0}
          .card .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
          .card small{display:block;color:var(--mu)}
          .ic{border:0;border-radius:12px;width:40px;height:40px;font-size:17px;background:#e5473f33;color:var(--tx);flex-shrink:0}
          .ic.rename{background:#4cc2e833}
          .cur{outline:2px solid var(--b)}
          .note{color:var(--mu);font-size:13px;padding:6px 4px}
          </style>
          </head>
          <body>
          <h1>🎧 مشغّل الدراسة</h1>
          <div id="app"></div>
          <script>
          let S;
          try { S = JSON.parse(localStorage.getItem('st') || 'null'); } catch (e) { S = null; }
          if (!S) S = {lists:[],last:null,open:null};
          S.open = null;
          let target = null;
          const save = () => { try { localStorage.setItem('st',JSON.stringify(S)); } catch(e){} };
          const uid = () => Math.random().toString(36).slice(2,9);
          const L = id => S.lists.find(l => l.id == id);
          const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          const fmt = ms => Math.floor(ms/60000)+':'+String(Math.floor(ms/1000)%60).padStart(2,'0');

          function addNew(){target=null;Android.pick();}
          function addTo(id){target=id;Android.pick();}
          function onPicked(a){
            if(!a.length)return;
            const tr=a.map(x=>({id:uid(),name:x.name,uri:x.uri}));
            if(target&&L(target))L(target).tracks.push(...tr);
            else S.lists.push({id:uid(),name:a.length>1?'قائمة '+(S.lists.length+1):tr[0].name,tracks:tr});
            save();render();
          }
          function play(lid,tid,pos){
            const l=L(lid);if(!l)return;
            const i=l.tracks.findIndex(t=>t.id==tid);if(i<0)return;
            S.last={l:lid,t:tid,pos:pos||0};save();
            Android.play(JSON.stringify(l.tracks.map(t=>({uri:t.uri,name:t.name}))),i,pos||0);
            render();
          }
          function tap(lid,tid){play(lid,tid,S.last&&S.last.t==tid?S.last.pos:0);}
          function resume(){const x=S.last;if(x&&L(x.l))play(x.l,x.t,x.pos);}
          function openL(id){S.open=id;render();}
          function renameL(id){
            const l=L(id);if(!l)return;
            const n=prompt('اكتب الاسم الجديد لقائمة التشغيل:',l.name);
            if(n===null)return;
            const v=n.trim();
            if(!v){alert('اكتب اسمًا غير فارغ.');return;}
            l.name=v;save();render();
          }
          function delL(id){
            if(!confirm('حذف القائمة؟'))return;
            S.lists=S.lists.filter(l=>l.id!=id);save();render();
          }
          function delT(lid,tid){
            const l=L(lid);if(!l)return;
            l.tracks=l.tracks.filter(t=>t.id!=tid);save();render();
          }
          function goBack(){
            if(S.open){S.open=null;render();return false;}
            return true;
          }
          function render(){
            const a=document.getElementById('app');
            if(!S.open){
              const x=S.last&&L(S.last.l);
              a.innerHTML='<button class="btn" onclick="addNew()">＋ إضافة صوتية / قائمة جديدة</button>'+
                (x?`<button class="btn s" onclick="resume()">▶ متابعة آخر صوتية (${fmt(S.last.pos)})</button>`:'')+
                '<h3>قوائم التشغيل</h3>'+
                (S.lists.map(l=>`<div class="card${S.last&&S.last.l==l.id?' cur':''}" onclick="openL('${l.id}')"><span style="font-size:24px">📁</span><div class="t">${esc(l.name)}<small>${l.tracks.length} ملف</small></div><button class="ic rename" title="إعادة تسمية" onclick="event.stopPropagation();renameL('${l.id}')">✏️</button><button class="ic" title="حذف القائمة" onclick="event.stopPropagation();delL('${l.id}')">🗑</button></div>`).join('')||'<div class="note">لا توجد قوائم بعد. أضف صوتياتك للبدء.</div>');
            }else{
              const l=L(S.open);
              if(!l){S.open=null;render();return;}
              a.innerHTML='<button class="btn s" onclick="goBack()">→ رجوع</button>'+
                `<h3>📁 ${esc(l.name)}</h3>`+
                `<button class="btn s" onclick="renameL('${l.id}')">✏️ إعادة تسمية قائمة التشغيل</button>`+
                `<button class="btn" onclick="addTo('${l.id}')">＋ إضافة ملفات للقائمة</button>`+
                (l.tracks.map(t=>`<div class="card${S.last&&S.last.t==t.id?' cur':''}" onclick="tap('${l.id}','${t.id}')"><span style="font-size:22px">🎵</span><div class="t">${esc(t.name)}</div><button class="ic" onclick="event.stopPropagation();delT('${l.id}','${t.id}')">🗑</button></div>`).join('')||'<div class="note">القائمة فارغة.</div>');
            }
          }
          setInterval(()=>{
            try{
              const s=JSON.parse(Android.state());if(!s.uri)return;
              for(const l of S.lists){
                const t=l.tracks.find(t=>t.uri==s.uri);
                if(t){
                  const ch=!S.last||S.last.t!=t.id;
                  S.last={l:l.id,t:t.id,pos:s.pos};save();
                  if(ch)render();
                  return;
                }
              }
            }catch(e){}
          },1000);
          render();
          </script>
          </body>
          </html>
          EOF

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatPlayer-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" proj/app/build/outputs/apk/debug/app-debug.apk --title "FloatPlayer v${{ github.run_number }}" --notes "ملف التثبيت app-debug.apk"
